<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board sketch</title>
<style>
  :root { --bg:#202725; --bar:#292F2D; --line:#343C38; --ink:#ECEFEC; --accent:#8FB4AA; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px system-ui, sans-serif; }
  .bar { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; background:var(--bar); border-bottom:1px solid var(--line); }
  button { font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  .sw { width:24px; height:24px; padding:0; border-radius:50%; }
  .sw[aria-pressed="true"] { outline:2px solid var(--ink); outline-offset:2px; }
  .gap { flex:1; }
  .stage { position:relative; margin:12px; }
  .stage img, .stage canvas { display:block; width:100%; height:auto; }
  .stage canvas { position:absolute; inset:0; height:100%; touch-action:none; cursor:crosshair; }
</style>
</head>

<script>
  const img = document.getElementById('shot'), pad = document.getElementById('pad'), ctx = pad.getContext('2d');
  let color = '#E5484D', width = 7, erasing = false, drawing = false, strokes = [], cur = null;
  function fit() { pad.width = img.naturalWidth; pad.height = img.naturalHeight; redraw(); }
  img.complete ? fit() : img.addEventListener('load', fit);
  function pt(e) { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height]; }
  function paint(s) {
    ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color; ctx.lineWidth = s.width; ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath(); s.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    if (s.pts.length === 1) ctx.lineTo(s.pts[0][0] + 0.1, s.pts[0][1]);
    ctx.stroke();
  }
  function redraw() { ctx.clearRect(0, 0, pad.width, pad.height); strokes.forEach(paint); }
  pad.addEventListener('pointerdown', e => { drawing = true; pad.setPointerCapture(e.pointerId); cur = { color, width: erasing ? width * 3 : width, erase: erasing, pts: [pt(e)] }; strokes.push(cur); redraw(); });
  pad.addEventListener('pointermove', e => { if (!drawing) return; cur.pts.push(pt(e)); redraw(); });
  ['pointerup', 'pointercancel'].forEach(t => pad.addEventListener(t, () => { drawing = false; }));
  function press(sel, el) { document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', b === el)); }
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { color = b.dataset.c; erasing = false; press('[data-c]', b); document.getElementById('erase').setAttribute('aria-pressed', false); });
  document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { width = +b.dataset.w; press('[data-w]', b); });
  document.getElementById('erase').onclick = e => { erasing = !erasing; e.target.setAttribute('aria-pressed', erasing); };
  document.getElementById('undo').onclick = () => { strokes.pop(); redraw(); };
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'z') { strokes.pop(); redraw(); } });
  document.getElementById('clear').onclick = () => { strokes = []; redraw(); };
  document.getElementById('save').onclick = () => {
    const out = document.createElement('canvas'); out.width = pad.width; out.height = pad.height;
    const o = out.getContext('2d'); o.drawImage(img, 0, 0); o.drawImage(pad, 0, 0);
    const a = document.createElement('a'); a.download = 'board_v5_sketch.png'; a.href = out.toDataURL('image/png'); a.click();
  };
</script>
