<?xml version="1.0" encoding="UTF-8"?>
<svg 
  xmlns="http://www.w3.org/2000/svg" 
  class="w-full h-auto" 
  viewBox="0 0 960 300" 
  preserveAspectRatio="xMidYMid meet"
  shape-rendering="geometricPrecision" 
  text-rendering="geometricPrecision"
  dir="ltr"
>
  <defs>
    <style>
      .mono-txt { font-family: 'Geist Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
      @keyframes dashAnim { to { stroke-dashoffset: -20; } }
      .flow-line { stroke-dasharray: 6 4; animation: dashAnim 1.2s linear infinite; }
    </style>
    <marker id="arrow-emerald-sw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-cyan-sw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-amber-sw" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="300" fill="#0C0E12" rx="12" stroke="#1E232D" stroke-width="1.5"/>

  <!-- Top System Header Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="10" r="4" fill="#38BDF8"/>
    <text x="20" y="14" fill="#E2E8F0" font-size="12" font-weight="700" letter-spacing="1" class="mono-txt">
      HIGH-THROUGHPUT ISO 8583 FINANCIAL SWITCH &amp; ROUTING MESH
    </text>
    <text x="560" y="14" fill="#94A3B8" font-size="11" font-weight="500" class="mono-txt">
      SYSTEM LATENCY SLA:
    </text>
    <rect x="680" y="0" width="230" height="26" rx="4" fill="#151921" stroke="#2A303C"/>
    <text x="795" y="17" fill="#10B981" font-size="11" font-weight="600" text-anchor="middle" class="mono-txt">
      &lt; 250MS ROUNDTRIP · 99.99% HA
    </text>
  </g>

  <!-- Flow Conduits between Stages -->
  <path d="M 235 160 L 260 160" stroke="#38BDF8" stroke-width="2" class="flow-line" marker-end="url(#arrow-cyan-sw)"/>
  <path d="M 475 160 L 500 160" stroke="#10B981" stroke-width="2" class="flow-line" marker-end="url(#arrow-emerald-sw)"/>
  <path d="M 715 160 L 740 160" stroke="#F59E0B" stroke-width="2" class="flow-line" marker-end="url(#arrow-amber-sw)"/>

  <!-- STAGE 01: Ingress Edge -->
  <g transform="translate(24, 60)">
    <rect width="210" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#38BDF8" font-size="11" font-weight="700" class="mono-txt">01 · INGRESS GATEWAY</text>
    
    <!-- Item 1: Ingress Protocol -->
    <rect x="12" y="44" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="60" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">TLS 1.3 / mTLS Auth</text>
    <text x="22" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">Merchant REST API Ingress</text>

    <!-- Item 2: Rate Limiting & Idempotency -->
    <rect x="12" y="96" width="186" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="114" fill="#38BDF8" font-size="11" font-weight="600" class="mono-txt">Token Bucket Limiter</text>
    <text x="22" y="128" fill="#94A3B8" font-size="9.5" class="mono-txt">Redis SETNX UUIDv4 Lock</text>
    <text x="22" y="140" fill="#10B981" font-size="9" class="mono-txt">Capacity: 50,000 TPS Peak</text>

    <!-- Item 3: Gateway SLA -->
    <rect x="12" y="158" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">Gateway Overhead</text>
    <text x="22" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">&lt; 4.8ms Budget</text>
  </g>

  <!-- STAGE 02: ISO 8583 Serialization Engine -->
  <g transform="translate(264, 60)">
    <rect width="210" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#10B981" font-size="11" font-weight="700" class="mono-txt">02 · ISO 8583 PARSER</text>
    
    <!-- Item 1: Bitmaps & MTI -->
    <rect x="12" y="44" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="60" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">MTI 0200 Purchase</text>
    <text x="22" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">Primary / Secondary Bitmaps</text>

    <!-- Item 2: Security & Encryption -->
    <rect x="12" y="96" width="186" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="114" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">HSM PIN Block (F52)</text>
    <text x="22" y="128" fill="#94A3B8" font-size="9.5" class="mono-txt">STAN (F11) · RRN (F37)</text>
    <text x="22" y="140" fill="#E2E8F0" font-size="9" class="mono-txt">Zero CVV2 Storage Vault</text>

    <!-- Item 3: Pack Time -->
    <rect x="12" y="158" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">Packing &amp; Unpacking SLA</text>
    <text x="22" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">&lt; 1.2ms (Zero-Copy C++)</text>
  </g>

  <!-- STAGE 03: Multi-PSP Routing Matrix -->
  <g transform="translate(504, 60)">
    <rect width="210" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#F59E0B" font-size="11" font-weight="700" class="mono-txt">03 · ROUTING MATRIX</text>
    
    <!-- Item 1: PSP Health Scoring -->
    <rect x="12" y="44" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="60" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">Dynamic Health Engine</text>
    <text x="22" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">Weight: Latency + Success Rate</text>

    <!-- Item 2: Upstream Connection -->
    <rect x="12" y="96" width="186" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="114" fill="#F59E0B" font-size="11" font-weight="600" class="mono-txt">Multi-Bank Dispatch</text>
    <text x="22" y="128" fill="#94A3B8" font-size="9.5" class="mono-txt">Mellat, Saman, Parsian, Tejarat</text>
    <text x="22" y="140" fill="#10B981" font-size="9" class="mono-txt">Fast Failover (&lt; 200ms)</text>

    <!-- Item 3: Link Monitoring -->
    <rect x="12" y="158" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">Shaparak Core Network</text>
    <text x="22" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">Keepalive Echo (MTI 0800)</text>
  </g>

  <!-- STAGE 04: Clearing Response & Telemetry -->
  <g transform="translate(744, 60)">
    <rect width="192" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="192" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#E2E8F0" font-size="11" font-weight="700" class="mono-txt">04 · CLEARING &amp; ACK</text>
    
    <!-- Item 1: MTI 0210 Response -->
    <rect x="12" y="44" width="168" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="20" y="60" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">MTI 0210 Response</text>
    <text x="20" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">Action Code: 00 (Approved)</text>

    <!-- Item 2: Auto-Reverse Safe State -->
    <rect x="12" y="96" width="168" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="20" y="114" fill="#38BDF8" font-size="11" font-weight="600" class="mono-txt">Auto-Reversal (0400)</text>
    <text x="20" y="128" fill="#94A3B8" font-size="9" class="mono-txt">Trigger: Bank Timeout</text>
    <text x="20" y="140" fill="#F59E0B" font-size="9" class="mono-txt">Async Outbox Retry Relay</text>

    <!-- Item 3: SLA Verification -->
    <rect x="12" y="158" width="168" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="20" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">P99 Total Latency</text>
    <text x="20" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">148ms End-to-End</text>
  </g>
</svg>
