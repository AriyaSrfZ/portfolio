<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="auto" class="w-full h-auto" preserveAspectRatio="xMidYMid meet" dir="ltr" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">

  <defs>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#527C78" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#527C78" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B39A77" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#B39A77" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FB4AA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8FB4AA" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C85A5A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C85A5A" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F3F0E8" fill-opacity="0.04"/>
    </pattern>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8FB4AA"/>
    </marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#B39A77"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#C85A5A"/>
    </marker>
  </defs>
  <style>
    text {
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
  <rect width="1000" height="520" fill="#171C1A" rx="14"/>
  <rect width="1000" height="520" fill="url(#grid-dots)" rx="14"/>
  <rect width="998" height="518" x="1" y="1" fill="none" stroke="#F3F0E8" stroke-opacity="0.08" rx="13"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <circle cx="6" cy="10" r="5" fill="#8FB4AA"/>
    <text x="20" y="14" fill="#8FB4AA" font-size="12" font-weight="700" letter-spacing="1.2">ARCHITECTURE SCHEMATIC · MODEL CONTEXT PROTOCOL (MCP)</text>
    <text x="20" y="30" fill="#B5BDB6" font-size="9.5">TOOL DEFINITION BLOAT · ATTENTION DEGRADATION · CLIENT SCHEMA PROJECTION</text>
    <rect x="640" y="0" width="296" height="28" rx="6" fill="#8FB4AA" fill-opacity="0.1" stroke="#8FB4AA" stroke-opacity="0.35"/>
    <circle cx="654" cy="14" r="4" fill="#8FB4AA"/>
    <text x="666" y="18" fill="#8FB4AA" font-size="10" font-weight="700">INVARIANT: TTFT &lt; 1000ms VIA PROJECTION</text>
  </g>

  <!-- COL 1: Raw Tool Registration Trap -->
  <g transform="translate(32, 85)">
    <rect width="280" height="395" rx="10" fill="#202725" stroke="#303936"/>
    <rect width="280" height="34" rx="10" fill="#292F2D" stroke="#303936"/>
    <text x="14" y="22" fill="#C85A5A" font-size="11" font-weight="700">01. RAW MCP REGISTRATION</text>

    <g transform="translate(14, 50)">
      <rect width="252" height="110" rx="6" fill="#171C1A" stroke="#C85A5A" stroke-opacity="0.6"/>
      <text x="10" y="20" fill="#C85A5A" font-size="9.5">Raw JSON-RPC Tool Dump</text>
      <text x="10" y="38" fill="#F0EEE7" font-size="9">&bull; 18 Tools in Context Window</text>
      <text x="10" y="54" fill="#F0EEE7" font-size="9">&bull; Full JSON-Schema Definitions</text>
      <text x="10" y="70" fill="#C85A5A" font-size="10" font-weight="700">4,200 TOKENS BEFORE PROMPT!</text>
      <text x="10" y="90" fill="#B5BDB6" font-size="8.5">Extraneous descriptions &amp; nested types</text>
      <text x="10" y="102" fill="#B5BDB6" font-size="8.5">saturate initial attention heads.</text>
    </g>

    <g transform="translate(14, 175)">
      <rect width="252" height="195" rx="6" fill="#292F2D" stroke="#46504B"/>
      <text x="10" y="20" fill="#C85A5A" font-size="10" font-weight="700">ATTENTION DEGRADATION:</text>
      <text x="10" y="38" fill="#B5BDB6" font-size="8.5">"Lost in the Middle" (Liu et al.)</text>
      
      <rect x="10" y="50" width="232" height="50" rx="4" fill="#171C1A"/>
      <text x="16" y="70" fill="#B39A77" font-size="9">Attention Weight Decay:</text>
      <text x="16" y="90" fill="#F0EEE7" font-size="9">A(pos) = exp(-gamma * dist(pos))</text>

      <text x="10" y="125" fill="#C85A5A" font-size="9" font-weight="700">TTFT LATENCY PENALTY:</text>
      <text x="10" y="145" fill="#F0EEE7" font-size="16" font-weight="700">7,200 ms TTFT</text>
      <text x="10" y="165" fill="#B5BDB6" font-size="8.5">Quadratic self-attention prefill latency</text>
      <text x="10" y="180" fill="#B5BDB6" font-size="8.5">drives interactive UI timeouts.</text>
    </g>
  </g>

  <!-- Connect 1 -> 2 -->
  <line x1="312" y1="280" x2="358" y2="280" stroke="#8FB4AA" stroke-width="2" marker-end="url(#arr-cyan)"/>

  <!-- COL 2: Client Schema Projection Gate -->
  <g transform="translate(360, 85)">
    <rect width="280" height="395" rx="10" fill="#202725" stroke="#303936"/>
    <rect width="280" height="34" rx="10" fill="#292F2D" stroke="#303936"/>
    <text x="14" y="22" fill="#8FB4AA" font-size="11" font-weight="700">02. SCHEMA PROJECTION</text>

    <g transform="translate(14, 50)">
      <rect width="252" height="135" rx="6" fill="#171C1A" stroke="#8FB4AA" stroke-opacity="0.6"/>
      <text x="10" y="20" fill="#8FB4AA" font-size="10" font-weight="700">PROJECTION ALGORITHM:</text>
      <text x="10" y="38" fill="#F0EEE7" font-size="8.5">1. Strip boilerplate field docs</text>
      <text x="10" y="54" fill="#F0EEE7" font-size="8.5">2. Extract parameter AST signatures</text>
      <text x="10" y="70" fill="#F0EEE7" font-size="8.5">3. Enforce 1,500 token global ceiling</text>
      
      <rect x="10" y="85" width="232" height="40" rx="4" fill="#292F2D"/>
      <text x="16" y="102" fill="#8FB4AA" font-size="9" font-weight="700">70% CONTEXT PRUNING</text>
      <text x="16" y="118" fill="#F0EEE7" font-size="8.5">4,200 &rarr; 1,260 Tokens Preserved</text>
    </g>

    <g transform="translate(14, 200)">
      <rect width="252" height="170" rx="6" fill="#292F2D" stroke="#46504B"/>
      <text x="10" y="20" fill="#B39A77" font-size="10" font-weight="700">MARKDOWN RESULT COMPACTION:</text>
      <text x="10" y="38" fill="#F0EEE7" font-size="8.5">Tool return payloads transformed</text>
      <text x="10" y="54" fill="#F0EEE7" font-size="8.5">from verbose multi-nested JSON arrays</text>
      <text x="10" y="70" fill="#F0EEE7" font-size="8.5">into compact Markdown tabular rows.</text>

      <rect x="10" y="85" width="232" height="70" rx="4" fill="#171C1A"/>
      <text x="16" y="104" fill="#8FB4AA" font-size="9" font-weight="700">Dynamic Pagination:</text>
      <text x="16" y="122" fill="#F0EEE7" font-size="8.5">Returns top 10 items + next_cursor</text>
      <text x="16" y="142" fill="#B5BDB6" font-size="8.5">Prevents context runaway on DB queries</text>
    </g>
  </g>

  <!-- Connect 2 -> 3 -->
  <line x1="640" y1="280" x2="686" y2="280" stroke="#8FB4AA" stroke-width="2" marker-end="url(#arr-cyan)"/>

  <!-- COL 3: Verified Performance Verdict -->
  <g transform="translate(688, 85)">
    <rect width="280" height="395" rx="10" fill="#202725" stroke="#303936"/>
    <rect width="280" height="34" rx="10" fill="#292F2D" stroke="#303936"/>
    <text x="14" y="22" fill="#8FB4AA" font-size="11" font-weight="700">03. VERIFIED TELEMETRY</text>

    <g transform="translate(14, 50)">
      <rect width="252" height="110" rx="6" fill="#171C1A" stroke="#8FB4AA" stroke-opacity="0.8"/>
      <text x="10" y="22" fill="#8FB4AA" font-size="10" font-weight="700">LATENCY COMPARISON:</text>
      <text x="10" y="44" fill="#B5BDB6" font-size="9">Baseline Raw TTFT: 7,200 ms</text>
      <text x="10" y="66" fill="#8FB4AA" font-size="14" font-weight="700">PROJECTED TTFT: 850 ms</text>
      <text x="10" y="86" fill="#B39A77" font-size="10" font-weight="700">8.4x INFERENCE SPEEDUP</text>
      <text x="10" y="100" fill="#F0EEE7" font-size="8.5">Sub-second interactive agent chat</text>
    </g>

    <g transform="translate(14, 175)">
      <rect width="252" height="195" rx="6" fill="#292F2D" stroke="#46504B"/>
      <text x="10" y="20" fill="#8FB4AA" font-size="10" font-weight="700">ACCURACY METRICS:</text>
      
      <circle cx="16" cy="45" r="3" fill="#8FB4AA"/>
      <text x="26" y="48" fill="#F0EEE7" font-size="8.5">Tool Call Accuracy: 99.4%</text>
      
      <circle cx="16" cy="70" r="3" fill="#8FB4AA"/>
      <text x="26" y="73" fill="#F0EEE7" font-size="8.5">Hallucinated Args: 0.0%</text>
      
      <circle cx="16" cy="95" r="3" fill="#8FB4AA"/>
      <text x="26" y="98" fill="#F0EEE7" font-size="8.5">Context Cost Savings: 68%</text>

      <rect x="10" y="115" width="232" height="65" rx="4" fill="#171C1A"/>
      <text x="16" y="135" fill="#8FB4AA" font-size="9" font-weight="700">Production Rule:</text>
      <text x="16" y="153" fill="#F0EEE7" font-size="8.5">Never register raw OpenAPI schemas</text>
      <text x="16" y="169" fill="#B39A77" font-size="8.5">Project schema at runtime gateway</text>
    </g>
  </g>
</svg>
