<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid-gt" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    <style>
      text { font-family: 'IBM Plex Mono', system-ui, -apple-system, monospace; user-select: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="480" fill="#0b1120" rx="10"/>
  <rect width="880" height="480" fill="url(#grid-gt)" rx="10"/>
  <rect x="0.5" y="0.5" width="879" height="479" stroke="#334155" stroke-width="1" rx="10"/>

  <!-- Tactical Header -->
  <line x1="16" y1="42" x2="864" y2="42" stroke="#334155" stroke-width="1"/>
  <rect x="24" y="18" width="8" height="8" fill="#06b6d4" rx="2"/>
  <text x="40" y="26" fill="#06b6d4" font-size="11" font-weight="700" letter-spacing="1">TAXONOMY // GLOBAL-MESSAGING-01</text>
  <text x="320" y="26" fill="#94a3b8" font-size="10" letter-spacing="0.5">CELLULAR PENETRATION &amp; BUSINESS MESSAGING TAXONOMY</text>
  <rect x="740" y="14" width="120" height="20" fill="#111827" stroke="#334155" rx="4"/>
  <text x="748" y="28" fill="#10b981" font-size="9" font-weight="700">GSMA / JUNIPER 2024</text>

  <!-- TIER 1: MACRO FOUNDATION -->
  <g id="macro-foundation">
    <rect x="30" y="56" width="820" height="74" fill="#111827" stroke="#3b82f6" stroke-width="1.2" rx="8"/>
    <rect x="30" y="56" width="220" height="22" fill="#1d4ed8" rx="8"/>
    <text x="140" y="71" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.8">GLOBAL CELLULAR SUBSCRIBER BASE</text>
    <text x="835" y="72" fill="#94a3b8" font-size="8.5" text-anchor="end">GSMA INTELLIGENCE BENCHMARK</text>

    <!-- Stat 1 -->
    <rect x="46" y="86" width="240" height="34" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="56" y="100" fill="#94a3b8" font-size="8.5">UNIQUE MOBILE SUBSCRIBERS:</text>
    <text x="56" y="113" fill="#38bdf8" font-size="11" font-weight="700">~5.6 BILLION (69% Global)</text>

    <!-- Stat 2 -->
    <rect x="306" y="86" width="240" height="34" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="316" y="100" fill="#94a3b8" font-size="8.5">ACTIVE CELLULAR SIM CONNECTIONS:</text>
    <text x="316" y="113" fill="#38bdf8" font-size="11" font-weight="700">~8.9 BILLION GLOBAL IOT/CELL</text>

    <!-- Stat 3 -->
    <rect x="566" y="86" width="268" height="34" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="576" y="100" fill="#94a3b8" font-size="8.5">UNIVERSAL PROTOCOL REACH:</text>
    <text x="576" y="113" fill="#10b981" font-size="11" font-weight="700">100% OF GSM/LTE HANDSETS</text>
  </g>

  <!-- BRANCHING CONNECTOR -->
  <path d="M 440 130 L 440 148" stroke="#334155" stroke-width="1.5"/>
  <path d="M 235 148 L 645 148" stroke="#334155" stroke-width="1.5"/>
  <path d="M 235 148 L 235 160" stroke="#334155" stroke-width="1.5"/>
  <path d="M 645 148 L 645 160" stroke="#334155" stroke-width="1.5"/>

  <!-- TIER 2: P2P vs A2P BRANCHES -->
  <g id="p2p-branch">
    <rect x="30" y="162" width="395" height="70" fill="#111827" stroke="#475569" stroke-width="1" rx="6"/>
    <text x="44" y="182" fill="#94a3b8" font-size="10" font-weight="700">P2P (PERSON-TO-PERSON MESSAGING)</text>
    <text x="44" y="200" fill="#cbd5e1" font-size="8.5">Predominantly migrated to consumer OTT applications</text>
    <text x="44" y="218" fill="#64748b" font-size="8">WhatsApp, iMessage, Telegram, WeChat. Low carrier SMS revenue growth.</text>
  </g>

  <g id="a2p-branch">
    <rect x="445" y="162" width="405" height="70" fill="#111827" stroke="#06b6d4" stroke-width="1.5" rx="6"/>
    <text x="460" y="182" fill="#06b6d4" font-size="11" font-weight="700">A2P (APPLICATION-TO-PERSON MESSAGING)</text>
    <text x="460" y="200" fill="#e2e8f0" font-size="9" font-weight="600">Enterprise to Consumer · ~$65B – $72B Annual Global Market</text>
    <text x="460" y="218" fill="#38bdf8" font-size="8">High-reliability enterprise routing for transactional, OTP, and commercial messaging.</text>
  </g>

  <!-- CONNECTOR DOWN FROM A2P -->
  <path d="M 645 232 L 645 250" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- TIER 3: A2P SUBDIVISIONS (OPERATIONAL vs PROMOTIONAL) -->
  <g id="a2p-subdivisions">
    <!-- Operational -->
    <rect x="30" y="252" width="400" height="106" fill="#111827" stroke="#10b981" stroke-width="1.2" rx="6"/>
    <rect x="30" y="252" width="220" height="20" fill="#059669" rx="6"/>
    <text x="140" y="266" fill="#ffffff" font-size="8.5" font-weight="700" text-anchor="middle">OPERATIONAL &amp; TRANSACTIONAL (65–70%)</text>

    <text x="44" y="288" fill="#e2e8f0" font-size="8.5" font-weight="600">Use Cases: OTP / 2FA, Fraud Alerts, Logistics, Banking</text>
    <text x="44" y="304" fill="#94a3b8" font-size="8">SLA Priority: P95 delivery latency &lt; 10s via direct carrier routes.</text>
    <text x="44" y="320" fill="#94a3b8" font-size="8">Vulnerability: High exposure to AIT (Artificially Inflated Traffic / SMS pumping).</text>
    <text x="44" y="340" fill="#10b981" font-size="8" font-weight="700">Channel Dependency: Highest (SMS fallback mandatory for 2FA)</text>

    <!-- Promotional -->
    <rect x="450" y="252" width="400" height="106" fill="#111827" stroke="#e2c974" stroke-width="1.2" rx="6"/>
    <rect x="450" y="252" width="200" height="20" fill="#ca8a04" rx="6"/>
    <text x="550" y="266" fill="#0b1120" font-size="8.5" font-weight="700" text-anchor="middle">PROMOTIONAL &amp; MARKETING (30–35%)</text>

    <text x="464" y="288" fill="#e2e8f0" font-size="8.5" font-weight="600">Use Cases: Flash sales, abandoned cart recovery, product offers</text>
    <text x="464" y="304" fill="#94a3b8" font-size="8">SLA Priority: Bulk throughput; tolerant of minute-level queue delays.</text>
    <text x="464" y="320" fill="#94a3b8" font-size="8">Regulatory: Strict consent gates (TCPA in US, GDPR in EU, TRAI in India).</text>
    <text x="464" y="340" fill="#e2c974" font-size="8" font-weight="700">Channel Shift: Migrating toward RCS &amp; WhatsApp Business for rich media</text>
  </g>

  <!-- TIER 4: CHANNEL EVOLUTION HORIZON -->
  <g id="channel-horizon">
    <rect x="30" y="372" width="820" height="92" fill="#111827" stroke="#334155" rx="8"/>
    <rect x="30" y="372" width="260" height="20" fill="#1f2937" rx="8"/>
    <text x="160" y="386" fill="#e2e8f0" font-size="8.5" font-weight="700" text-anchor="middle">BUSINESS MESSAGING CHANNEL LANDSCAPE</text>

    <!-- 3 Channel Mini-Cards -->
    <rect x="46" y="400" width="250" height="52" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="56" y="416" fill="#38bdf8" font-size="9" font-weight="700">STANDARD A2P SMS</text>
    <text x="56" y="430" fill="#94a3b8" font-size="8">Ubiquitous 100% reach · 160-char text limit</text>
    <text x="56" y="442" fill="#64748b" font-size="7.5">Universal fallback · Subject to wholesale carrier fees</text>

    <rect x="312" y="400" width="250" height="52" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="322" y="416" fill="#a78bfa" font-size="9" font-weight="700">RCS BUSINESS MESSAGING (RBM)</text>
    <text x="322" y="430" fill="#94a3b8" font-size="8">UP 2.4 protocol · Verified sender badges &amp; rich cards</text>
    <text x="322" y="442" fill="#64748b" font-size="7.5">Native on Android · Accelerating with iOS 18 support</text>

    <rect x="578" y="400" width="258" height="52" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="588" y="416" fill="#10b981" font-size="9" font-weight="700">OTT BUSINESS PLATFORMS</text>
    <text x="588" y="430" fill="#94a3b8" font-size="8">WhatsApp, Viber, Apple Messages for Business</text>
    <text x="588" y="442" fill="#64748b" font-size="7.5">24-hour service conversation windows · Rich UI buttons</text>
  </g>
</svg>
