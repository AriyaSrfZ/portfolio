      <stop offset="0%" stop-color="#15171C"/>
      <stop offset="100%" stop-color="#0D0E11"/>
    </linearGradient>
    <marker id="arrowJade2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <style>
      @keyframes flowDash { to { stroke-dashoffset: -32; } }
      .anim-flow { stroke-dasharray: 10, 6; animation: flowDash 1.4s linear infinite; }
      text { font-family: system-ui, -apple-system, sans-serif; }
