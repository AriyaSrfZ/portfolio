<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b90a8"/>
    </marker>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="900" height="380" fill="#0b0e17"/>
  <text x="450" y="35" text-anchor="middle" fill="#e8eaf2" font-family="sans-serif" font-size="18" font-weight="bold">Event-Driven Payment Flow (vs. a single synchronous chain)</text>

  <g font-family="sans-serif" font-size="13" fill="#e8eaf2">
    <rect x="30" y="150" width="150" height="60" rx="10" fill="url(#grad2)" opacity="0.85"/>
    <text x="105" y="175" text-anchor="middle" font-weight="bold">Payment</text>
    <text x="105" y="193" text-anchor="middle">initiated</text>

    <line x1="180" y1="180" x2="230" y2="180" stroke="#8b90a8" stroke-width="2" marker-end="url(#arrow2)"/>

    <rect x="235" y="150" width="140" height="60" rx="10" fill="#151a2b" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="305" y="175" text-anchor="middle" font-weight="bold">Event queue</text>
    <text x="305" y="193" text-anchor="middle" font-size="11" fill="#c7cadb">(async, durable)</text>

    <line x1="375" y1="165" x2="440" y2="90" stroke="#8b90a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="375" y1="180" x2="440" y2="180" stroke="#8b90a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="375" y1="195" x2="440" y2="270" stroke="#8b90a8" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="445" y="60" width="160" height="55" rx="8" fill="#151a2b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="525" y="83" text-anchor="middle" font-size="12" font-weight="bold">Ledger service</text>
    <text x="525" y="100" text-anchor="middle" font-size="10" fill="#c7cadb">writes the transaction</text>

    <rect x="445" y="153" width="160" height="55" rx="8" fill="#151a2b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="525" y="176" text-anchor="middle" font-size="12" font-weight="bold">Fraud check</text>
    <text x="525" y="193" text-anchor="middle" font-size="10" fill="#c7cadb">scores the pattern</text>

    <rect x="445" y="245" width="160" height="55" rx="8" fill="#151a2b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="525" y="268" text-anchor="middle" font-size="12" font-weight="bold">Notification</text>
    <text x="525" y="285" text-anchor="middle" font-size="10" fill="#c7cadb">tells the user</text>

    <line x1="605" y1="87" x2="670" y2="175" stroke="#8b90a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="605" y1="180" x2="670" y2="180" stroke="#8b90a8" stroke-width="1.5" marker-end="url(#arrow2)"/>
    <line x1="605" y1="272" x2="670" y2="185" stroke="#8b90a8" stroke-width="1.5" marker-end="url(#arrow2)"/>

    <rect x="675" y="150" width="190" height="60" rx="10" fill="url(#grad2)" opacity="0.85"/>
    <text x="770" y="175" text-anchor="middle" font-weight="bold">Reconciliation</text>
    <text x="770" y="193" text-anchor="middle" font-size="11">settles once, from events</text>
  </g>

  <text x="450" y="335" text-anchor="middle" fill="#8b90a8" font-family="sans-serif" font-size="12">Each service fails or scales independently — one slow step no longer blocks the others</text>
</svg>
