  <!-- Tactical Corner Crosshairs -->
  <rect x="2" y="2" width="6" height="6" fill="#141210" stroke="#c4562e" stroke-width="1"/>
  <rect x="592" y="2" width="6" height="6" fill="#141210" stroke="#c4562e" stroke-width="1"/>
  <rect x="2" y="332" width="6" height="6" fill="#141210" stroke="#c4562e" stroke-width="1"/>
  <rect x="592" y="332" width="6" height="6" fill="#141210" stroke="#c4562e" stroke-width="1"/>

  <!-- Top Metadata Bar -->
  <rect x="20" y="16" width="560" height="24" fill="#1c1916" stroke="#5c6650" stroke-width="1"/>
  <text x="32" y="32" fill="#c4562e" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" letter-spacing="1">SPEC.02 // TOPOLOGY</text>
  <text x="300" y="32" fill="#a8a196" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">FORENSIC FRAUD MITIGATION &amp; GRAPH TRACING</text>
  <text x="568" y="32" fill="#c9d4a8" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" text-anchor="end">SLA: &lt;15MS</text>

  <!-- Module 1: Ingestion -->
  <rect x="20" y="120" width="110" height="80" fill="#1c1916" stroke="#c4562e" stroke-width="1.5"/>
  <rect x="20" y="120" width="110" height="16" fill="#c4562e"/>
  <text x="75" y="132" fill="#141210" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">INGESTION</text>
  <text x="75" y="156" fill="#e8e2d5" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">KAFKA CLUSTER</text>
  <text x="75" y="172" fill="#a8a196" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">Telemetry Event Bus</text>
  <text x="75" y="186" fill="#c9a15a" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">50K TPS Burst</text>

  <!-- Conduit 1 -->
  <line x1="130" y1="160" x2="175" y2="160" stroke="#c4562e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="175,160 167,156 167,164" fill="#c4562e"/>

  <!-- Module 2: Stream Processing -->
  <rect x="175" y="120" width="125" height="80" fill="#1c1916" stroke="#c9a15a" stroke-width="1.5"/>
  <rect x="175" y="120" width="125" height="16" fill="#c9a15a"/>
  <text x="237" y="132" fill="#141210" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">CEP ENGINE</text>
  <text x="237" y="156" fill="#e8e2d5" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">APACHE FLINK</text>
  <text x="237" y="172" fill="#a8a196" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">Sliding Window CEP</text>
  <text x="237" y="186" fill="#c9d4a8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">Entropy &lt; 15ms</text>

  <!-- Branch lines -->
  <path d="M 300 160 L 325 160 L 325 100 L 345 100" stroke="#5c6650" stroke-width="1.5" fill="none"/>
  <polygon points="345,100 337,96 337,104" fill="#5c6650"/>

  <path d="M 300 160 L 325 160 L 325 220 L 345 220" stroke="#5c6650" stroke-width="1.5" fill="none"/>
  <polygon points="345,220 337,216 337,224" fill="#5c6650"/>

  <!-- Module 3: Graph DB -->
  <rect x="345" y="65" width="120" height="74" fill="#1c1916" stroke="#5c6650" stroke-width="1.5"/>
  <rect x="345" y="65" width="120" height="16" fill="#3d4632"/>
  <text x="405" y="77" fill="#c9d4a8" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">GRAPH CLUSTER</text>
  <text x="405" y="101" fill="#e8e2d5" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">NEO4J</text>
  <text x="405" y="117" fill="#a8a196" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">Forensic Graph Tracing</text>
  <text x="405" y="129" fill="#c9a15a" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">Multi-Hop Rings</text>

  <!-- Module 4: Relational Store -->
  <rect x="345" y="185" width="120" height="74" fill="#1c1916" stroke="#5c6650" stroke-width="1.5"/>
  <rect x="345" y="185" width="120" height="16" fill="#3d4632"/>
  <text x="405" y="197" fill="#c9d4a8" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">AUDIT LOG</text>
  <text x="405" y="221" fill="#e8e2d5" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">POSTGRESQL</text>
  <text x="405" y="237" fill="#a8a196" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">Dispute Evidence Store</text>
  <text x="405" y="249" fill="#c9a15a" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">FATA Dossiers</text>

  <!-- Action Node -->
  <rect x="495" y="120" width="85" height="80" fill="#1c1916" stroke="#c4562e" stroke-width="1.5"/>
  <rect x="495" y="120" width="85" height="16" fill="#c4562e"/>
  <text x="537" y="132" fill="#141210" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">ACTION</text>
  <text x="537" y="156" fill="#e8e2d5" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">AML / 3DS</text>
  <text x="537" y="172" fill="#c9d4a8" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">Liability Shift</text>
  <text x="537" y="186" fill="#c9a15a" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">Hold / Pass</text>

  <path d="M 465 102 L 480 102 L 480 150 L 495 150" stroke="#c9a15a" stroke-width="1.2" fill="none"/>
  <path d="M 465 222 L 480 222 L 480 170 L 495 170" stroke="#c9a15a" stroke-width="1.2" fill="none"/>
</svg>
