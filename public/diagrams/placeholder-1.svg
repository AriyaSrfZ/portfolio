             C 200 280, 230 252, 270 249 
             C 310 246, 350 268, 390 262 
             C 430 256, 460 236, 500 240 
             C 540 244, 570 260, 610 254 
             C 640 248, 670 272, 696 264 
             L 696 304 Z" 
