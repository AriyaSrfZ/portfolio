  <path d="M 4 366 L 4 376 L 14 376" stroke="#e2c974" stroke-width="1.5" fill="none"/>
  <path d="M 726 376 L 736 376 L 736 366" stroke="#e2c974" stroke-width="1.5" fill="none"/>

