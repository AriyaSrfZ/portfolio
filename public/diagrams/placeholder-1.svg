<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <rect width="600" height="340" rx="8" fill="#15171C"/>
  <rect x="0.5" y="0.5" width="599" height="339" rx="7.5" stroke="#23262E"/>
  
  <!-- Ingestion -->
  <rect x="30" y="130" width="100" height="60" rx="6" fill="#0D0E11" stroke="#059669" stroke-width="1.5"/>
  <text x="80" y="158" fill="#F0F2F5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">KAFKA</text>
  <text x="80" y="174" fill="#7E8494" font-family="monospace" font-size="9" text-anchor="middle">INGESTION</text>

  <!-- Arrow 1 -->
  <line x1="130" y1="160" x2="180" y2="160" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="180,160 174,156 174,164" fill="#059669"/>

  <!-- Stream Processing -->
  <rect x="180" y="130" width="110" height="60" rx="6" fill="#0D0E11" stroke="#10B981" stroke-width="1.5"/>
  <text x="235" y="158" fill="#F0F2F5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">APACHE FLINK</text>
  <text x="235" y="174" fill="#7E8494" font-family="monospace" font-size="9" text-anchor="middle">CEP ENGINE</text>

  <!-- Arrow 2 -->
  <line x1="290" y1="160" x2="340" y2="160" stroke="#10B981" stroke-width="1.5"/>
  <polygon points="340,160 334,156 334,164" fill="#10B981"/>

  <!-- Graph DB -->
  <rect x="340" y="70" width="110" height="60" rx="6" fill="#0D0E11" stroke="#23262E" stroke-width="1.5"/>
  <text x="395" y="98" fill="#F0F2F5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">NEO4J</text>
  <text x="395" y="114" fill="#7E8494" font-family="monospace" font-size="9" text-anchor="middle">GRAPH CLUSTER</text>

  <!-- Relational Cold Store -->
  <rect x="340" y="190" width="110" height="60" rx="6" fill="#0D0E11" stroke="#23262E" stroke-width="1.5"/>
  <text x="395" y="218" fill="#F0F2F5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">POSTGRESQL</text>
  <text x="395" y="234" fill="#7E8494" font-family="monospace" font-size="9" text-anchor="middle">AUDIT LEDGER</text>

  <!-- Branch lines -->
  <path d="M 290 160 L 315 160 L 315 100 L 340 100" stroke="#7E8494" stroke-width="1.2" fill="none"/>
  <path d="M 290 160 L 315 160 L 315 220 L 340 220" stroke="#7E8494" stroke-width="1.2" fill="none"/>

  <!-- Alerts Node -->
  <rect x="490" y="130" width="80" height="60" rx="6" fill="#059669" fill-opacity="0.1" stroke="#059669" stroke-width="1.5"/>
  <text x="530" y="158" fill="#10B981" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">ALERT / AML</text>
  <text x="530" y="174" fill="#10B981" font-family="monospace" font-size="9" text-anchor="middle">ACTION</text>

  <path d="M 450 100 L 470 100 L 470 150 L 490 150" stroke="#059669" stroke-width="1.2" fill="none"/>
  <path d="M 450 220 L 470 220 L 470 170 L 490 170" stroke="#059669" stroke-width="1.2" fill="none"/>
</svg>
