<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid-p1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#221e1a" stroke-width="0.5"/>
    </pattern>
    <style>
      text {
        font-family: 'IBM Plex Mono', monospace;
        user-select: none;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="740" height="340" fill="#141210" rx="0"/>
  <rect width="740" height="340" fill="url(#grid-p1)" rx="0"/>

  <!-- Outer Frame & Tactical Reticle -->
  <rect x="0.5" y="0.5" width="739" height="339" stroke="#5c6650" stroke-width="1" rx="0"/>
  <rect x="8" y="8" width="724" height="324" stroke="#5c6650" stroke-width="0.5" stroke-opacity="0.4" rx="0"/>

  <!-- Tactical Corner Crosshairs -->
  <path d="M 4 14 L 4 4 L 14 4" stroke="#c9a15a" stroke-width="1.5" fill="none"/>
  <path d="M 726 4 L 736 4 L 736 14" stroke="#c9a15a" stroke-width="1.5" fill="none"/>
  <path d="M 4 326 L 4 336 L 14 336" stroke="#c9a15a" stroke-width="1.5" fill="none"/>
  <path d="M 726 336 L 736 336 L 736 326" stroke="#c9a15a" stroke-width="1.5" fill="none"/>

  <!-- Telemetry Header Bar -->
  <line x1="8" y1="36" x2="732" y2="36" stroke="#5c6650" stroke-width="1" stroke-opacity="0.6"/>
  <rect x="18" y="16" width="6" height="6" fill="#c4562e" rx="0"/>
  <text x="32" y="23" fill="#c4562e" font-size="9" font-weight="700" letter-spacing="1.5">SPEC-ID: 8409-AS // 01 // PAYMENT SETTLEMENT SWITCH</text>
  <text x="420" y="23" fill="#a8a196" font-size="8" letter-spacing="0.5">EVENT-DRIVEN LEDGER INVARIANTS</text>
  <rect x="620" y="13" width="102" height="17" fill="#1c1916" stroke="#5c6650" stroke-width="1" rx="0"/>
  <rect x="626" y="18" width="6" height="6" fill="#c9d4a8" rx="0"/>
  <text x="638" y="24" fill="#c9d4a8" font-size="7.5" font-weight="700" letter-spacing="0.5">SLA: &lt;50MS CLEAR</text>

  <!-- ================= MODULE 01: gRPC API INGRESS ================= -->
  <g id="mod-grpc">
    <rect x="24" y="60" width="144" height="190" fill="#1c1916" stroke="#c4562e" stroke-width="1.5" rx="0"/>
    <rect x="24" y="60" width="144" height="24" fill="#c4562e" rx="0"/>
    <text x="96" y="76" fill="#141210" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">01 // INGRESS</text>
    
    <text x="96" y="105" fill="#e8e2d5" font-size="11" font-weight="700" text-anchor="middle">gRPC API INGRESS</text>
    <text x="96" y="122" fill="#c4562e" font-size="8.5" font-weight="700" text-anchor="middle">Port :8443 / TLS 1.3</text>
    
    <line x1="36" y1="135" x2="156" y2="135" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="2 2"/>
    
    <text x="96" y="152" fill="#a8a196" font-size="7.5" text-anchor="middle">mTLS Mutual Auth</text>
    <text x="96" y="168" fill="#a8a196" font-size="7.5" text-anchor="middle">Protobuf Serialization</text>
    <text x="96" y="184" fill="#c9a15a" font-size="7.5" text-anchor="middle">Idempotency Token Extr.</text>
    <text x="96" y="200" fill="#a8a196" font-size="7.5" text-anchor="middle">Burst Buffer: 50K TPS</text>
    
    <rect x="36" y="215" width="120" height="20" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
    <text x="96" y="228" fill="#c9d4a8" font-size="7" font-weight="700" text-anchor="middle">NONCE: VERIFIED</text>
  </g>

  <!-- Conduit 1 -> 2 -->
  <path d="M 168 155 L 202 155" stroke="#c4562e" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="204,155 194,150 194,160" fill="#c4562e"/>
  <text x="186" y="145" fill="#c4562e" font-size="7" font-weight="700" text-anchor="middle">CLAIM</text>

  <!-- ================= MODULE 02: REDIS SETNX LOCK ================= -->
  <g id="mod-redis">
    <rect x="204" y="60" width="150" height="190" fill="#1c1916" stroke="#c9a15a" stroke-width="1.5" rx="0"/>
    <rect x="204" y="60" width="150" height="24" fill="#c9a15a" rx="0"/>
    <text x="279" y="76" fill="#141210" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">02 // MUTEX GUARD</text>
    
    <text x="279" y="105" fill="#e8e2d5" font-size="11" font-weight="700" text-anchor="middle">REDIS SETNX LOCK</text>
    <text x="279" y="122" fill="#c9a15a" font-size="8.5" font-weight="700" text-anchor="middle">TTL: 86,400s (24HR)</text>
    
    <line x1="216" y1="135" x2="342" y2="135" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="2 2"/>
    
    <text x="279" y="152" fill="#a8a196" font-size="7.5" text-anchor="middle">O(1) Concurrency Lock</text>
    <text x="279" y="168" fill="#a8a196" font-size="7.5" text-anchor="middle">Duplicate Capture Guard</text>
    <text x="279" y="184" fill="#e8e2d5" font-size="7.5" text-anchor="middle">Replay Window Shield</text>
    <text x="279" y="200" fill="#c9a15a" font-size="7.5" text-anchor="middle">Sentinel Cluster Quorum</text>
    
    <rect x="216" y="215" width="126" height="20" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
    <text x="279" y="228" fill="#c9a15a" font-size="7" font-weight="700" text-anchor="middle">STATE: ACQUIRED</text>
  </g>

  <!-- Conduit 2 -> 3 -->
  <path d="M 354 155 L 388 155" stroke="#c9a15a" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="390,155 380,150 380,160" fill="#c9a15a"/>
  <text x="372" y="145" fill="#c9a15a" font-size="7" font-weight="700" text-anchor="middle">BITMAP</text>

  <!-- ================= MODULE 03: ISO 8583 HOST ROUTER ================= -->
  <g id="mod-iso">
    <rect x="390" y="60" width="150" height="190" fill="#1c1916" stroke="#5c6650" stroke-width="1.5" rx="0"/>
    <rect x="390" y="60" width="150" height="24" fill="#3d4632" rx="0"/>
    <text x="465" y="76" fill="#c9d4a8" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">03 // HOST ROUTER</text>
    
    <text x="465" y="105" fill="#e8e2d5" font-size="11" font-weight="700" text-anchor="middle">ISO 8583 ROUTER</text>
    <text x="465" y="122" fill="#c9d4a8" font-size="8.5" font-weight="700" text-anchor="middle">H2H Switch Engine</text>
    
    <line x1="402" y1="135" x2="528" y2="135" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="2 2"/>
    
    <text x="465" y="152" fill="#a8a196" font-size="7.5" text-anchor="middle">128-Bit Binary Bitmaps</text>
    <text x="465" y="168" fill="#a8a196" font-size="7.5" text-anchor="middle">MTI 0200 / 0210 / 0420</text>
    <text x="465" y="184" fill="#c4562e" font-size="7.5" text-anchor="middle">Auto-Reverse on Timeout</text>
    <text x="465" y="200" fill="#a8a196" font-size="7.5" text-anchor="middle">Upstream Bank Clearing</text>
    
    <rect x="402" y="215" width="126" height="20" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
    <text x="465" y="228" fill="#c9d4a8" font-size="7" font-weight="700" text-anchor="middle">DISPATCH: ACTIVE</text>
  </g>

  <!-- Conduit 3 -> 4 -->
  <path d="M 540 155 L 574 155" stroke="#5c6650" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="576,155 566,150 566,160" fill="#5c6650"/>
  <text x="558" y="145" fill="#5c6650" font-size="7" font-weight="700" text-anchor="middle">REPLAY</text>

  <!-- ================= MODULE 04: SCYLLADB LEDGER ================= -->
  <g id="mod-ledger">
    <rect x="576" y="60" width="140" height="190" fill="#1c1916" stroke="#c4562e" stroke-width="1.5" rx="0"/>
    <rect x="576" y="60" width="140" height="24" fill="#c4562e" rx="0"/>
    <text x="646" y="76" fill="#141210" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">04 // AUDIT LEDGER</text>
    
    <text x="646" y="105" fill="#e8e2d5" font-size="11" font-weight="700" text-anchor="middle">SCYLLADB LEDGER</text>
    <text x="646" y="122" fill="#c4562e" font-size="8.5" font-weight="700" text-anchor="middle">Double-Entry ACID</text>
    
    <line x1="588" y1="135" x2="704" y2="135" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="2 2"/>
    
    <text x="646" y="152" fill="#a8a196" font-size="7.5" text-anchor="middle">Append-Only Event Store</text>
    <text x="646" y="168" fill="#e8e2d5" font-size="7.5" text-anchor="middle">Zero UPDATE Statements</text>
    <text x="646" y="184" fill="#c9a15a" font-size="7.5" text-anchor="middle">Deterministic Replay</text>
    <text x="646" y="200" fill="#a8a196" font-size="7.5" text-anchor="middle">Partition: Account + Date</text>
    
    <rect x="588" y="215" width="116" height="20" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
    <text x="646" y="228" fill="#c9d4a8" font-size="7" font-weight="700" text-anchor="middle">BALANCE: IMMUTABLE</text>
  </g>

  <!-- ================= INVARIANT TELEMETRY FOOTER ================= -->
  <rect x="24" y="268" width="692" height="48" fill="#1c1916" stroke="#5c6650" stroke-width="1" rx="0"/>
  <rect x="24" y="268" width="4" height="48" fill="#c4562e" rx="0"/>
  <text x="38" y="286" fill="#c4562e" font-size="8" font-weight="700" letter-spacing="1">ARCHITECTURAL INVARIANT:</text>
  <text x="175" y="286" fill="#e8e2d5" font-size="8">REQUEST STATE != SETTLEMENT FACT. ZERO DOUBLE-SETTLEMENT ACROSS 86,400s REPLAY WINDOWS.</text>
  <text x="38" y="303" fill="#a8a196" font-size="7.5">FAILURE MODE MITIGATION: AUTOMATIC 0420 REVERSE COMMIT POSTED AS NEW LEDGER ROW UPON TIMEOUT. NO STATE DRIFT.</text>
</svg>
