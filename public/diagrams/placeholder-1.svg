    <line x1="44" y1="288" x2="696" y2="288" stroke="#334155" stroke-width="0.5" stroke-dasharray="2 2"/>
    <text x="698" y="290" fill="#64748b" font-size="6.5">10ms</text>

    <line x1="44" y1="304" x2="696" y2="304" stroke="#334155" stroke-width="0.75"/>

