<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Blueprint Grid Pattern -->
    <pattern id="ruggedGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#221e1a" stroke-width="0.5"/>
    </pattern>
    <style>
      text {
        font-family: 'IBM Plex Mono', monospace;
        user-select: none;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="340" fill="#141210" rx="0"/>
  <rect width="600" height="340" fill="url(#ruggedGrid)" rx="0"/>

  <!-- Outer Borders and Inset Tactical Reticle -->
  <rect x="0.5" y="0.5" width="599" height="339" fill="none" stroke="#5c6650" stroke-width="1" rx="0"/>
  <rect x="8" y="8" width="584" height="324" fill="none" stroke="#5c6650" stroke-width="0.5" stroke-opacity="0.35" rx="0"/>

  <!-- Corner Brackets -->
  <path d="M 4 14 L 4 4 L 14 4" stroke="#c9a15a" stroke-width="1.5" fill="none"/>
  <path d="M 586 4 L 596 4 L 596 14" stroke="#c9a15a" stroke-width="1.5" fill="none"/>
  <path d="M 4 326 L 4 336 L 14 336" stroke="#c9a15a" stroke-width="1.5" fill="none"/>
  <path d="M 586 336 L 596 336 L 596 326" stroke="#c9a15a" stroke-width="1.5" fill="none"/>

  <!-- Header Telemetry Strip -->
  <line x1="8" y1="34" x2="592" y2="34" stroke="#5c6650" stroke-width="1" stroke-opacity="0.6"/>
  <text x="18" y="24" fill="#c4562e" font-size="8.5" font-weight="700" letter-spacing="1.5">SYS.ARCH // TXN-SETTLE-02</text>
  <text x="195" y="24" fill="#a8a196" font-size="7.5" letter-spacing="0.5">EVENT-DRIVEN SETTLEMENT &amp; RECONCILIATION</text>
  
  <rect x="496" y="14" width="86" height="15" fill="#1c1916" stroke="#5c6650" stroke-width="1" rx="0"/>
  <rect x="500" y="18" width="7" height="7" fill="#c9d4a8" rx="0"/>
  <text x="512" y="25" fill="#c9d4a8" font-size="7" font-weight="700" letter-spacing="0.5">LOCK: ACTIVE</text>

  <!-- ================= MODULE 1: INGRESS EDGE ================= -->
  <g id="mod-ingress">
    <rect x="22" y="126" width="108" height="84" fill="#1c1916" stroke="#5c6650" stroke-width="1.2" rx="0"/>
    <rect x="22" y="126" width="108" height="16" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
    <rect x="25" y="130" width="4" height="8" fill="#c4562e" rx="0"/>
    <text x="34" y="138" fill="#c4562e" font-size="7.5" font-weight="700">01 // INGRESS</text>
    <text x="110" y="138" fill="#a8a196" font-size="6.5">:8443</text>
    <text x="76" y="160" fill="#e8e2d5" font-size="10" font-weight="700" text-anchor="middle">gRPC INGRESS</text>
    <text x="76" y="174" fill="#c4562e" font-size="8" font-weight="700" text-anchor="middle">mTLS Payload</text>
    <line x1="28" y1="182" x2="124" y2="182" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="76" y="194" fill="#a8a196" font-size="7" text-anchor="middle">AUTH: STRICT mTLS</text>
    <text x="76" y="203" fill="#a8a196" font-size="6.5" text-anchor="middle">NONCE: VERIFIED</text>
  </g>

  <!-- ================= MODULE 2: CONCURRENCY LOCK ================= -->
  <g id="mod-redis">
    <rect x="166" y="46" width="124" height="76" fill="#1c1916" stroke="#5c6650" stroke-width="1.2" rx="0"/>
    <rect x="166" y="46" width="124" height="16" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
    <rect x="169" y="50" width="4" height="8" fill="#c9a15a" rx="0"/>
    <text x="178" y="58" fill="#c9a15a" font-size="7.5" font-weight="700">02 // MUTEX LOCK</text>
    <text x="270" y="58" fill="#a8a196" font-size="6.5">:6379</text>
    <text x="228" y="78" fill="#e8e2d5" font-size="10" font-weight="700" text-anchor="middle">REDIS SETNX</text>
    <text x="228" y="93" fill="#c9a15a" font-size="8" font-weight="700" text-anchor="middle">Idempotency TTL</text>
    <line x1="172" y1="100" x2="284" y2="100" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="228" y="112" fill="#a8a196" font-size="7" text-anchor="middle">TTL: 120s // ATOMIC</text>
  </g>

  <!-- ================= MODULE 3: TRANSACTION OUTBOX ================= -->
  <g id="mod-outbox">
    <rect x="166" y="156" width="130" height="96" fill="#1c1916" stroke="#5c6650" stroke-width="1.2" rx="0"/>
    <rect x="166" y="156" width="130" height="16" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
    <rect x="169" y="160" width="4" height="8" fill="#c9d4a8" rx="0"/>
    <text x="178" y="168" fill="#c9d4a8" font-size="7.5" font-weight="700">03 // RELAY ENGINE</text>
    <text x="231" y="188" fill="#e8e2d5" font-size="9" font-weight="700" text-anchor="middle">TRANSACTION OUTBOX</text>
    <text x="231" y="203" fill="#c9d4a8" font-size="8" font-weight="700" text-anchor="middle">CDC / Event Relay</text>
    <line x1="172" y1="211" x2="290" y2="211" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="231" y="224" fill="#a8a196" font-size="7" text-anchor="middle">WAL LOG TAIL // ACK</text>
    <text x="231" y="238" fill="#c4562e" font-size="7" font-weight="700" text-anchor="middle">GUARANTEE: AT-LEAST-ONCE</text>
  </g>

  <!-- ================= MODULE 4: 2-PHASE RECONCILER ================= -->
  <g id="mod-reconciler">
    <rect x="332" y="46" width="128" height="76" fill="#1c1916" stroke="#5c6650" stroke-width="1.2" rx="0"/>
    <rect x="332" y="46" width="128" height="16" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
    <rect x="335" y="50" width="4" height="8" fill="#c4562e" rx="0"/>
    <text x="344" y="58" fill="#c4562e" font-size="7.5" font-weight="700">04 // RECONCILER</text>
    <text x="396" y="78" fill="#e8e2d5" font-size="10" font-weight="700" text-anchor="middle">RECONCILER</text>
    <text x="396" y="93" fill="#c4562e" font-size="8" font-weight="700" text-anchor="middle">2PC State Verification</text>
    <line x1="338" y1="100" x2="454" y2="100" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="396" y="112" fill="#a8a196" font-size="7" text-anchor="middle">DUAL QUORUM CONSENSUS</text>
  </g>

  <!-- ================= MODULE 5: TARGET STORE ================= -->
  <g id="mod-scylladb">
    <rect x="466" y="156" width="116" height="96" fill="#1c1916" stroke="#5c6650" stroke-width="1.2" rx="0"/>
    <rect x="466" y="156" width="116" height="16" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
    <rect x="469" y="160" width="4" height="8" fill="#c9d4a8" rx="0"/>
    <text x="478" y="168" fill="#c9d4a8" font-size="7.5" font-weight="700">05 // IMMUTABLE LOG</text>
    <text x="560" y="168" fill="#a8a196" font-size="6.5">:9042</text>
    <text x="524" y="188" fill="#e8e2d5" font-size="10" font-weight="700" text-anchor="middle">SCYLLADB</text>
    <text x="524" y="203" fill="#c9d4a8" font-size="8" font-weight="700" text-anchor="middle">Append-Only ACID Log</text>
    <line x1="472" y1="211" x2="576" y2="211" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="524" y="224" fill="#a8a196" font-size="7" text-anchor="middle">PARTITION KEY: TX_ID</text>
    <text x="524" y="238" fill="#c9a15a" font-size="7" font-weight="700" text-anchor="middle">LOCAL_QUORUM // SSTABLE</text>
  </g>

  <!-- ================= CONDUITS, BUS BARS & ARROWS ================= -->

  <!-- 1. Ingress -> Redis SetNX (Mutex Lock) -->
  <path d="M 130 148 L 148 148 L 148 84 L 166 84" stroke="#c9a15a" stroke-width="1.5" fill="none"/>
  <polygon points="166,84 159,80 159,88" fill="#c9a15a"/>
  <rect x="146" y="146" width="4" height="4" fill="#c9a15a" rx="0"/>
  <rect x="135" y="104" width="26" height="12" fill="#141210" stroke="#5c6650" stroke-width="0.8" rx="0"/>
  <text x="148" y="113" fill="#c9a15a" font-size="6.5" font-weight="700" text-anchor="middle">SETNX</text>

  <!-- 2. Ingress -> Transaction Outbox (Atomic Write) -->
  <line x1="130" y1="184" x2="166" y2="184" stroke="#5c6650" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="166,184 159,180 159,188" fill="#5c6650"/>
  <rect x="135" y="178" width="26" height="12" fill="#141210" stroke="#5c6650" stroke-width="0.8" rx="0"/>
  <text x="148" y="187" fill="#e8e2d5" font-size="6.5" font-weight="700" text-anchor="middle">WRITE</text>

  <!-- 3. Redis SetNX <-> Reconciler (Lease / Lock Verification) -->
  <line x1="290" y1="84" x2="332" y2="84" stroke="#c9a15a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="332,84 325,80 325,88" fill="#c9a15a"/>
  <polygon points="290,84 297,80 297,88" fill="#c9a15a"/>
  <rect x="296" y="78" width="30" height="12" fill="#141210" stroke="#5c6650" stroke-width="0.8" rx="0"/>
  <text x="311" y="87" fill="#c9a15a" font-size="6.5" font-weight="700" text-anchor="middle">LEASE</text>

  <!-- 4. Outbox -> Reconciler (CDC Event Relay Stream) -->
  <path d="M 296 184 L 314 184 L 314 104 L 332 104" stroke="#c4562e" stroke-width="1.5" fill="none"/>
  <polygon points="332,104 325,100 325,108" fill="#c4562e"/>
  <rect x="312" y="182" width="4" height="4" fill="#c4562e" rx="0"/>
  <rect x="301" y="136" width="26" height="12" fill="#141210" stroke="#5c6650" stroke-width="0.8" rx="0"/>
  <text x="314" y="145" fill="#c4562e" font-size="6.5" font-weight="700" text-anchor="middle">CDC</text>

  <!-- 5. Outbox -> ScyllaDB (Data Pipeline / Event Relay) -->
  <line x1="296" y1="204" x2="466" y2="204" stroke="#c9d4a8" stroke-width="1.8" stroke-dasharray="5 3"/>
  <polygon points="466,204 458,200 458,208" fill="#c9d4a8"/>
  <rect x="345" y="198" width="76" height="13" fill="#141210" stroke="#5c6650" stroke-width="0.8" rx="0"/>
  <text x="383" y="207" fill="#c9d4a8" font-size="6.5" font-weight="700" text-anchor="middle">EVENT RELAY STREAM</text>

  <!-- 6. Reconciler -> ScyllaDB (2PC Commit / Settlement Affirmation) -->
  <path d="M 460 84 L 524 84 L 524 156" stroke="#c9a15a" stroke-width="1.5" fill="none"/>
  <polygon points="524,156 520,148 528,148" fill="#c9a15a"/>
  <rect x="522" y="82" width="4" height="4" fill="#c9a15a" rx="0"/>
  <rect x="472" y="78" width="42" height="12" fill="#141210" stroke="#5c6650" stroke-width="0.8" rx="0"/>
  <text x="493" y="87" fill="#c9a15a" font-size="6.5" font-weight="700" text-anchor="middle">2PC COMMIT</text>

  <!-- ================= TACTICAL BUS BAR ================= -->
  <line x1="22" y1="274" x2="582" y2="274" stroke="#5c6650" stroke-width="2"/>
  <line x1="22" y1="277" x2="582" y2="277" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Bus Bar Vertical Taps -->
  <line x1="76" y1="210" x2="76" y2="274" stroke="#5c6650" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="74" y="272" width="4" height="4" fill="#5c6650" rx="0"/>

  <line x1="231" y1="252" x2="231" y2="274" stroke="#c9d4a8" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="229" y="272" width="4" height="4" fill="#c9d4a8" rx="0"/>

  <line x1="524" y1="252" x2="524" y2="274" stroke="#c9d4a8" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="522" y="272" width="4" height="4" fill="#c9d4a8" rx="0"/>

  <rect x="285" y="268" width="148" height="13" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
  <text x="359" y="277" fill="#c9a15a" font-size="7" font-weight="700" letter-spacing="1" text-anchor="middle">EVENT BUS // AUDIT TRAIL</text>

  <!-- ================= TELEMETRY FOOTER ================= -->
  <rect x="22" y="294" width="560" height="28" fill="#1c1916" stroke="#5c6650" stroke-width="1" rx="0"/>

  <text x="32" y="311" fill="#a8a196" font-size="7.5" font-weight="700">INP:</text>
  <text x="56" y="311" fill="#e8e2d5" font-size="7.5" font-weight="700">mTLS / gRPC</text>

  <line x1="145" y1="298" x2="145" y2="318" stroke="#5c6650" stroke-width="1"/>
  <text x="154" y="311" fill="#a8a196" font-size="7.5" font-weight="700">LOCK:</text>
  <text x="184" y="311" fill="#c9a15a" font-size="7.5" font-weight="700">SETNX IDEMPOTENT</text>

  <line x1="290" y1="298" x2="290" y2="318" stroke="#5c6650" stroke-width="1"/>
  <text x="299" y="311" fill="#a8a196" font-size="7.5" font-weight="700">CDC:</text>
  <text x="325" y="311" fill="#c4562e" font-size="7.5" font-weight="700">WAL-TAIL RELAY</text>

  <line x1="430" y1="298" x2="430" y2="318" stroke="#5c6650" stroke-width="1"/>
  <text x="439" y="311" fill="#a8a196" font-size="7.5" font-weight="700">STORE:</text>
  <text x="475" y="311" fill="#c9d4a8" font-size="7.5" font-weight="700">SCYLLA LSM-TREE</text>
</svg>
