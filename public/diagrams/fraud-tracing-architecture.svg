<?xml version="1.0" encoding="UTF-8"?>
<svg 
  xmlns="http://www.w3.org/2000/svg" 
  class="w-full h-auto" 
  viewBox="0 0 960 300" 
  preserveAspectRatio="xMidYMid meet"
  shape-rendering="geometricPrecision" 
  text-rendering="geometricPrecision"
  dir="ltr"
>
  <defs>
    <style>
      .mono-txt { font-family: 'Geist Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
      @keyframes dashAnim { to { stroke-dashoffset: -20; } }
      .flow-line { stroke-dasharray: 6 4; animation: dashAnim 1.2s linear infinite; }
    </style>
    <marker id="arrow-emerald-fr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-cyan-fr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-amber-fr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="300" fill="#0C0E12" rx="12" stroke="#1E232D" stroke-width="1.5"/>

  <!-- Top System Header Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="10" r="4" fill="#F59E0B"/>
    <text x="20" y="14" fill="#E2E8F0" font-size="12" font-weight="700" letter-spacing="1" class="mono-txt">
      REAL-TIME FRAUD FORENSICS, GRAPH ENGINE &amp; eKYC IDENTITY MESH
    </text>
    <text x="600" y="14" fill="#94A3B8" font-size="11" font-weight="500" class="mono-txt">
      EVALUATION SLA:
    </text>
    <rect x="710" y="0" width="200" height="26" rx="4" fill="#151921" stroke="#2A303C"/>
    <text x="810" y="17" fill="#10B981" font-size="11" font-weight="600" text-anchor="middle" class="mono-txt">
      &lt; 15MS SLA · ZERO CVV2
    </text>
  </g>

  <!-- Flow Conduits between Stages -->
  <path d="M 235 160 L 260 160" stroke="#38BDF8" stroke-width="2" class="flow-line" marker-end="url(#arrow-cyan-fr)"/>
  <path d="M 475 160 L 500 160" stroke="#10B981" stroke-width="2" class="flow-line" marker-end="url(#arrow-emerald-fr)"/>
  <path d="M 715 160 L 740 160" stroke="#F59E0B" stroke-width="2" class="flow-line" marker-end="url(#arrow-amber-fr)"/>

  <!-- STAGE 01: Client Sensors & Edge Telemetry -->
  <g transform="translate(24, 60)">
    <rect width="210" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#38BDF8" font-size="11" font-weight="700" class="mono-txt">01 · EDGE SENSORS</text>
    
    <!-- Item 1: Hardware Telemetry -->
    <rect x="12" y="44" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="60" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">Canvas / WebGL Fingerprint</text>
    <text x="22" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">Entropy: 0.94 Confidence</text>

    <!-- Item 2: Behavioral Dynamics -->
    <rect x="12" y="96" width="186" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="114" fill="#38BDF8" font-size="11" font-weight="600" class="mono-txt">Behavioral Dynamics</text>
    <text x="22" y="128" fill="#94A3B8" font-size="9.5" class="mono-txt">Keystroke Flight &amp; Dwell Time</text>
    <text x="22" y="140" fill="#10B981" font-size="9" class="mono-txt">Bot Emulation: Rejected</text>

    <!-- Item 3: IP Velocity -->
    <rect x="12" y="158" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">IP Cluster Velocity</text>
    <text x="22" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">ASN / Geo-Hop Score: 98/100</text>
  </g>

  <!-- STAGE 02: Identity & eKYC Verification -->
  <g transform="translate(264, 60)">
    <rect width="210" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#10B981" font-size="11" font-weight="700" class="mono-txt">02 · eKYC &amp; HARIM OTP</text>
    
    <!-- Item 1: Shahkar Verification -->
    <rect x="12" y="44" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="60" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">Shahkar SIM Match</text>
    <text x="22" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">National ID &harr; MSISDN 1:1</text>

    <!-- Item 2: Dynamic OTP & Sabt-Ahval -->
    <rect x="12" y="96" width="186" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="114" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">Harim OTP Pipeline</text>
    <text x="22" y="128" fill="#94A3B8" font-size="9.5" class="mono-txt">120s Dynamic Cryptographic Token</text>
    <text x="22" y="140" fill="#E2E8F0" font-size="9" class="mono-txt">Sabt-Ahval Real-Time KYC</text>

    <!-- Item 3: Identity SLA -->
    <rect x="12" y="158" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">Lookup Overhead</text>
    <text x="22" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">&lt; 4.5ms Cached Verification</text>
  </g>

  <!-- STAGE 03: Graph Fraud Engine & Syndicate Detection -->
  <g transform="translate(504, 60)">
    <rect width="210" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#F59E0B" font-size="11" font-weight="700" class="mono-txt">03 · GRAPH FORENSICS</text>
    
    <!-- Item 1: Neo4j / Graph Topology -->
    <rect x="12" y="44" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="60" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">Neo4j Graph Traversal</text>
    <text x="22" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">Account &harr; Device &harr; Card Mesh</text>

    <!-- Item 2: Mule Detection -->
    <rect x="12" y="96" width="186" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="114" fill="#F59E0B" font-size="11" font-weight="600" class="mono-txt">Syndicate &amp; Mule Detection</text>
    <text x="22" y="128" fill="#94A3B8" font-size="9.5" class="mono-txt">Rapid Circular Flow Analysis</text>
    <text x="22" y="140" fill="#10B981" font-size="9" class="mono-txt">Sybil Ring Auto-Quarantine</text>

    <!-- Item 3: Graph SLA -->
    <rect x="12" y="158" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">3-Hop Neighborhood Query</text>
    <text x="22" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">&lt; 8.0ms In-Memory Graph</text>
  </g>

  <!-- STAGE 04: Decision Engine & Zero-CVV2 Vault -->
  <g transform="translate(744, 60)">
    <rect width="192" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="192" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#E2E8F0" font-size="11" font-weight="700" class="mono-txt">04 · SECURE VAULT</text>
    
    <!-- Item 1: Decision Gate -->
    <rect x="12" y="44" width="168" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="20" y="60" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">ALLOW / CHALLENGE</text>
    <text x="20" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">Risk Score: 12/100 (Pass)</text>

    <!-- Item 2: Zero-Storage CVV2 Token Vault -->
    <rect x="12" y="96" width="168" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="20" y="114" fill="#38BDF8" font-size="11" font-weight="600" class="mono-txt">Zero CVV2 Storage</text>
    <text x="20" y="128" fill="#94A3B8" font-size="9" class="mono-txt">Ephemeral Tokenization</text>
    <text x="20" y="140" fill="#10B981" font-size="9" class="mono-txt">PCI-DSS Level 1 Hardware</text>

    <!-- Item 3: Loop SLA Verification -->
    <rect x="12" y="158" width="168" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="20" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">Total Loop Latency</text>
    <text x="20" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">13.8ms &lt; 15ms SLA</text>
  </g>
</svg>