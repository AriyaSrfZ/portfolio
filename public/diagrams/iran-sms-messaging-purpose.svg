<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid-mp" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    <style>
      text { font-family: 'Vazirmatn', 'IBM Plex Mono', system-ui, -apple-system, sans-serif; user-select: none; }
      .mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="480" fill="#0b1120" rx="10"/>
  <rect width="880" height="480" fill="url(#grid-mp)" rx="10"/>
  <rect x="0.5" y="0.5" width="879" height="479" stroke="#334155" stroke-width="1" rx="10"/>

  <!-- Tactical Header -->
  <line x1="16" y1="42" x2="864" y2="42" stroke="#334155" stroke-width="1"/>
  <rect x="24" y="18" width="8" height="8" fill="#10b981" rx="2"/>
  <text x="40" y="26" fill="#10b981" font-size="11" font-weight="700" letter-spacing="0.5" class="mono">DIAGRAM 03 · DASTEHBANDI-E-PAYAM</text>
  <text x="320" y="26" fill="#e2e8f0" font-size="11" font-weight="600">تفکیک کاربردی پیامک: خدماتی و تراکنشی در برابر تبلیغاتی و ترویجی</text>
  <rect x="740" y="14" width="120" height="20" fill="#111827" stroke="#334155" rx="4"/>
  <text x="748" y="28" fill="#10b981" font-size="9" font-weight="700" class="mono">نسبت کل: ۷۰٪ به ۳۰٪</text>

  <!-- MAIN SPLIT BARS (70% vs 30%) -->
  <g id="split-overview">
    <rect x="30" y="58" width="560" height="44" fill="#065f46" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="310" y="85" fill="#ecfdf5" font-size="13" font-weight="700" text-anchor="middle">۷۰٪ پیامک خدماتی، عملیاتی و احراز هویت (Service &amp; Transactional)</text>

    <rect x="600" y="58" width="250" height="44" fill="#831843" stroke="#f43f5e" stroke-width="1.5" rx="6"/>
    <text x="725" y="85" fill="#fff1f2" font-size="13" font-weight="700" text-anchor="middle">۳۰٪ تبلیغاتی و ترویجی (Promotional)</text>
  </g>

  <!-- COLUMN 1: SERVICE & TRANSACTIONAL DEEP DIVE -->
  <g id="col-service">
    <rect x="30" y="114" width="400" height="250" fill="#111827" stroke="#10b981" stroke-width="1.2" rx="8"/>
    <rect x="30" y="114" width="220" height="26" fill="#10b981" rx="8"/>
    <text x="140" y="132" fill="#0b1120" font-size="10" font-weight="700" text-anchor="middle">ویژگی‌های ترافیک خدماتی (۷۰٪)</text>
    <text x="415" y="132" fill="#94a3b8" font-size="9" class="mono" text-anchor="end">SLA CRITICAL</text>

    <!-- Items -->
    <g transform="translate(46, 154)">
      <circle cx="6" cy="6" r="3" fill="#10b981"/>
      <text x="18" y="10" fill="#e2e8f0" font-size="10" font-weight="600">موارد مصرف اصلی:</text>
      <text x="18" y="28" fill="#94a3b8" font-size="9">رمز یکبار مصرف (OTP / 2FA)، تراکنش‌های بانکی، رهگیری سفارش و لاگ سیستم</text>
    </g>

    <g transform="translate(46, 196)">
      <circle cx="6" cy="6" r="3" fill="#10b981"/>
      <text x="18" y="10" fill="#e2e8f0" font-size="10" font-weight="600">خطوط خدماتی (Service Lines):</text>
      <text x="18" y="28" fill="#94a3b8" font-size="9">عبور تضمینی از لیست سیاه بلک‌لیست مخابراتی (*800#) با تعهد حقوقی سفت‌وسخت</text>
    </g>

    <g transform="translate(46, 238)">
      <circle cx="6" cy="6" r="3" fill="#10b981"/>
      <text x="18" y="10" fill="#e2e8f0" font-size="10" font-weight="600">معیار عملکرد کلیدی (KPI):</text>
      <text x="18" y="28" fill="#94a3b8" font-size="9">تأخیر تحویل زیر ۵ ثانیه (P95 Latency &lt; 5s)، نرخ شکست کمتر از ۰.۵٪ در گیت‌وی</text>
    </g>

    <g transform="translate(46, 280)">
      <circle cx="6" cy="6" r="3" fill="#10b981"/>
      <text x="18" y="10" fill="#e2e8f0" font-size="10" font-weight="600">الگوی مصرف:</text>
      <text x="18" y="28" fill="#94a3b8" font-size="9">توزیع یکنواخت ۲۴ ساعته با قله‌های متناسب با فعالیت کاربران در طول روز</text>
    </g>
  </g>

  <!-- COLUMN 2: PROMOTIONAL & MARKETING DEEP DIVE -->
  <g id="col-promo">
    <rect x="450" y="114" width="400" height="250" fill="#111827" stroke="#f43f5e" stroke-width="1.2" rx="8"/>
    <rect x="450" y="114" width="220" height="26" fill="#f43f5e" rx="8"/>
    <text x="560" y="132" fill="#fff1f2" font-size="10" font-weight="700" text-anchor="middle">ویژگی‌های ترافیک تبلیغاتی (۳۰٪)</text>
    <text x="835" y="132" fill="#94a3b8" font-size="9" class="mono" text-anchor="end">FILTER RESTRICTED</text>

    <!-- Items -->
    <g transform="translate(466, 154)">
      <circle cx="6" cy="6" r="3" fill="#f43f5e"/>
      <text x="18" y="10" fill="#e2e8f0" font-size="10" font-weight="600">موارد مصرف اصلی:</text>
      <text x="18" y="28" fill="#94a3b8" font-size="9">کمپین‌های تخفیفی، رویدادهای فصلی، بازاریابی بازگشتی (Retargeting) و پروموشن</text>
    </g>

    <g transform="translate(466, 196)">
      <circle cx="6" cy="6" r="3" fill="#f43f5e"/>
      <text x="18" y="10" fill="#e2e8f0" font-size="10" font-weight="600">محدودیت لیست سیاه (*800#):</text>
      <text x="18" y="28" fill="#94a3b8" font-size="9">بخش قابل توجهی از مشترکین تبلیغات را مسدود کرده‌اند (سوزانده شدن هزینه در SMSC)</text>
    </g>

    <g transform="translate(466, 238)">
      <circle cx="6" cy="6" r="3" fill="#f43f5e"/>
      <text x="18" y="10" fill="#e2e8f0" font-size="10" font-weight="600">الزام رگولاتوری «لغو ۱۱»:</text>
      <text x="18" y="28" fill="#94a3b8" font-size="9">کسر اجباری کاراکتر از انتهای متن و افزایش احتمال ورود به بخش دوم پیامک (۲ PDU)</text>
    </g>

    <g transform="translate(466, 280)">
      <circle cx="6" cy="6" r="3" fill="#f43f5e"/>
      <text x="18" y="10" fill="#e2e8f0" font-size="10" font-weight="600">الگوی مصرف:</text>
      <text x="18" y="28" fill="#94a3b8" font-size="9">ارسال‌های انبوه دسته‌ای (Batch Spikes) در ساعات مجاز روز (۹ صبح تا ۸ شب)</text>
    </g>
  </g>

  <!-- BOTTOM: PDU CODING & CONCATENATION RULES -->
  <g id="bottom-pdu-specs">
    <rect x="30" y="376" width="820" height="90" fill="#111827" stroke="#334155" rx="8"/>
    <rect x="30" y="376" width="220" height="22" fill="#334155" rx="8"/>
    <text x="140" y="391" fill="#e2e8f0" font-size="9.5" font-weight="700" text-anchor="middle">مشخصات فنی کدگذاری کاراکتر و بسته (PDU)</text>
    <text x="835" y="391" fill="#06b6d4" font-size="8.5" class="mono" text-anchor="end">UCS-2 vs GSM-7</text>

    <!-- 3 columns inside -->
    <text x="46" y="418" fill="#38bdf8" font-size="9.5" font-weight="700" class="mono">پیامک فارسی (کدگذاری UCS-2 / 16-bit):</text>
    <text x="46" y="434" fill="#94a3b8" font-size="8.5">بخش اول: ۷۰ کاراکتر. از بخش دوم به بعد به دلیل هدر اتصال (UDH)، هر پارت ۶۷ کاراکتر محاسبه می‌شود.</text>
    <text x="46" y="450" fill="#64748b" font-size="8">افزودن پسوند اجباری «لغو ۱۱» حدود ۸ کاراکتر فضا را کسر می‌کند و ریسک ۲ برابر شدن هزینه ارسال دارد.</text>

    <line x1="450" y1="404" x2="450" y2="458" stroke="#334155" stroke-width="1"/>

    <text x="466" y="418" fill="#e2c974" font-size="9.5" font-weight="700" class="mono">پیامک انگلیسی (کدگذاری GSM 03.38 / 7-bit):</text>
    <text x="466" y="434" fill="#94a3b8" font-size="8.5">بخش اول: ۱۶۰ کاراکتر. پارت‌های بعدی در حالت متصل (Concatenated) هرکدام ۱۵۳ کاراکتر ظرفیت دارند.</text>
    <text x="466" y="450" fill="#64748b" font-size="8">وجود حتی یک کاراکتر فارسی یا ایموجی غیراستاندارد، کل پیامک را فوراً به مد UCS-2 (سقف ۷۰ کاراکتر) تنزل می‌دهد.</text>
  </g>
</svg>
