<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid-tl" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#28312E" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    <style>
      text { font-family: 'Vazirmatn', 'IBM Plex Mono', system-ui, -apple-system, sans-serif; user-select: none; }
      .mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" fill="#171C1A" rx="10"/>
  <rect width="880" height="500" fill="url(#grid-tl)" rx="10"/>
  <rect x="0.5" y="0.5" width="879" height="499" stroke="#3A4441" stroke-width="1" rx="10"/>

  <!-- Tactical Header -->
  <line x1="16" y1="42" x2="864" y2="42" stroke="#3A4441" stroke-width="1"/>
  <rect x="24" y="18" width="8" height="8" fill="#527C78" rx="2"/>
  <text x="40" y="26" fill="#527C78" font-size="11" font-weight="700" letter-spacing="0.5" class="mono">DIAGRAM 05 · TIMELINE &amp; INFLECTION POINTS</text>
  <text x="340" y="26" fill="#D5D0C6" font-size="11" font-weight="600">سیر تحول، نقاط عطف و رگولاتوری بازار پیامک ایران (۱۳۸۱ تا ۱۴۰۳)</text>
  <rect x="755" y="14" width="105" height="20" fill="#202725" stroke="#3A4441" rx="4"/>
  <text x="763" y="28" fill="#8FB4AA" font-size="9" font-weight="700" class="mono">TECHRASA INSIGHT</text>

  <!-- Central Chronological Rail -->
  <line x1="60" y1="250" x2="820" y2="250" stroke="#3A4441" stroke-width="3" stroke-dasharray="4 4"/>
  
  <!-- Phase 1: 1381 - 1386 -->
  <circle cx="110" cy="250" r="8" fill="#527C78" stroke="#171C1A" stroke-width="2"/>
  <rect x="30" y="60" width="160" height="165" fill="#202725" stroke="#527C78" stroke-width="1" rx="8"/>
  <rect x="38" y="68" width="65" height="16" fill="#527C78" fill-opacity="0.15" rx="3"/>
  <text x="45" y="80" fill="#8FB4AA" font-size="10" font-weight="700" class="mono">۱۳۸۱ - ۱۳۸۶</text>
  <text x="40" y="102" fill="#F3F0E8" font-size="11" font-weight="700">پیدایش و مجوزهای اولیه</text>
  <text x="40" y="122" fill="#B5BDB6" font-size="9.5">• آغاز پیامک در شبکه همراه اول</text>
  <text x="40" y="140" fill="#B5BDB6" font-size="9.5">• اعطای ۳ مجوز درگاه اول:</text>
  <text x="50" y="156" fill="#C5C0B6" font-size="9">مگفا (۳۰۰۰)، آتیه (۲۰۰۰)، رهیاب (۱۰۰۰)</text>
  <text x="40" y="174" fill="#B5BDB6" font-size="9.5">• اولین ارسال‌های انبوه متنی</text>
  <text x="40" y="192" fill="#B5BDB6" font-size="9.5">• زیرساخت سنتی SMSC</text>

  <!-- Phase 2: 1387 - 1392 -->
  <circle cx="270" cy="250" r="8" fill="#6E9792" stroke="#171C1A" stroke-width="2"/>
  <rect x="195" y="275" width="160" height="165" fill="#202725" stroke="#6E9792" stroke-width="1" rx="8"/>
  <rect x="203" y="283" width="65" height="16" fill="#6E9792" fill-opacity="0.15" rx="3"/>
  <text x="210" y="295" fill="#8FB4AA" font-size="10" font-weight="700" class="mono">۱۳۸۷ - ۱۳۹۲</text>
  <text x="205" y="317" fill="#F3F0E8" font-size="11" font-weight="700">انفجار پنل‌ها و تبلیغات</text>
  <text x="205" y="337" fill="#B5BDB6" font-size="9.5">• تولد اولین پنل‌های وب مستقل</text>
  <text x="205" y="355" fill="#B5BDB6" font-size="9.5">• اوج ارسال پیامک‌های تبلیغاتی</text>
  <text x="205" y="373" fill="#B5BDB6" font-size="9.5">• پیامک تعاملی تلویزیونی (برنامه ۹۰)</text>
  <text x="205" y="391" fill="#B5BDB6" font-size="9.5">• شکل‌گیری شبکه نمایندگی (Reseller)</text>
  <text x="205" y="409" fill="#D47272" font-size="9.5">• آغاز نارضایتی عمومی از اسپم</text>

  <!-- Phase 3: 1393 - 1397 -->
  <circle cx="440" cy="250" r="8" fill="#B39A77" stroke="#171C1A" stroke-width="2"/>
  <rect x="365" y="60" width="160" height="165" fill="#202725" stroke="#B39A77" stroke-width="1" rx="8"/>
  <rect x="373" y="68" width="65" height="16" fill="#B39A77" fill-opacity="0.15" rx="3"/>
  <text x="380" y="80" fill="#C8B191" font-size="10" font-weight="700" class="mono">۱۳۹۳ - ۱۳۹۷</text>
  <text x="375" y="102" fill="#F3F0E8" font-size="11" font-weight="700">انقلاب بلک‌لیست و OTP</text>
  <text x="375" y="122" fill="#B5BDB6" font-size="9.5">• راه‌اندازی سامانه بلک‌لیست *۸۰۰#</text>
  <text x="375" y="140" fill="#B5BDB6" font-size="9.5">• افت تقاضای تبلیغات انبوه</text>
  <text x="375" y="158" fill="#B5BDB6" font-size="9.5">• انفجار پیامک ورود (OTP) با سوپراپ‌ها</text>
  <text x="375" y="176" fill="#B5BDB6" font-size="9.5">• تعریف فرآیند خطوط خدماتی حقوقی</text>
  <text x="375" y="194" fill="#B5BDB6" font-size="9.5">• فعال‌سازی ماسک برند (نام تجاری)</text>

  <!-- Phase 4: 1398 - ۱۴۰۰ -->
  <circle cx="600" cy="250" r="8" fill="#8FB4AA" stroke="#171C1A" stroke-width="2"/>
  <rect x="525" y="275" width="160" height="165" fill="#202725" stroke="#8FB4AA" stroke-width="1" rx="8"/>
  <rect x="533" y="283" width="65" height="16" fill="#8FB4AA" fill-opacity="0.15" rx="3"/>
  <text x="540" y="295" fill="#8FB4AA" font-size="10" font-weight="700" class="mono">۱۳۹۸ - ۱۴۰۰</text>
  <text x="535" y="317" fill="#F3F0E8" font-size="11" font-weight="700">تمرکز دولتی و همگرایی</text>
  <text x="535" y="337" fill="#B5BDB6" font-size="9.5">• الزام سامانه «پیام ایران» (۴۰۴۰)</text>
  <text x="535" y="355" fill="#B5BDB6" font-size="9.5">• تعطیلی خدمات ارزش‌افزوده (VAS)</text>
  <text x="535" y="373" fill="#B5BDB6" font-size="9.5">• نقش پشتیبان پیامک در اختلال نت</text>
  <text x="535" y="391" fill="#B5BDB6" font-size="9.5">• حضور اپراتورهای مجازی (MVNO)</text>
  <text x="535" y="409" fill="#B5BDB6" font-size="9.5">• ورود به تلفن ابری، چت و ایمیل</text>

  <!-- Phase 5: ۱۴۰۱ - ۱۴۰۳ -->
  <circle cx="760" cy="250" r="8" fill="#C85A5A" stroke="#171C1A" stroke-width="2"/>
  <rect x="685" y="60" width="170" height="165" fill="#202725" stroke="#C85A5A" stroke-width="1" rx="8"/>
  <rect x="693" y="68" width="65" height="16" fill="#C85A5A" fill-opacity="0.15" rx="3"/>
  <text x="700" y="80" fill="#D47272" font-size="10" font-weight="700" class="mono">۱۴۰۱ - ۱۴۰۳</text>
  <text x="695" y="102" fill="#F3F0E8" font-size="11" font-weight="700">جهش تعرفه و هدفمندی</text>
  <text x="695" y="122" fill="#D47272" font-size="9.5">• افزایش ۲ برابری تعرفه پایه</text>
  <text x="695" y="140" fill="#B5BDB6" font-size="9.5">• اجبار پسوند «لغو ۱۱» در تبلیغات</text>
  <text x="695" y="158" fill="#B5BDB6" font-size="9.5">• راهبرد پیامک زیر ۷۰ کاراکتر</text>
  <text x="695" y="176" fill="#B5BDB6" font-size="9.5">• پیامک‌های مکان‌محور (LBS)</text>
  <text x="695" y="194" fill="#8FB4AA" font-size="9.5">• غلبه ۷۰٪ پیام‌های خدماتی و احراز</text>

  <!-- Footer note -->
  <text x="40" y="475" fill="#8C9790" font-size="9.5" class="mono">SOURCE: TECHRASA INSIGHT (2024) · SURVEY PERIOD: 1401-1402 · SYSTEM ARCHITECTURE REFACTOR</text>
</svg>