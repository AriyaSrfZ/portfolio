<?xml version="1.0" encoding="UTF-8"?>
<svg 
  xmlns="http://www.w3.org/2000/svg" 
  class="w-full h-auto" 
  viewBox="0 0 960 300" 
  preserveAspectRatio="xMidYMid meet"
  shape-rendering="geometricPrecision" 
  text-rendering="geometricPrecision"
  dir="ltr"
>
  <defs>
    <style>
      .mono-txt { font-family: 'Geist Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
      @keyframes dashAnim { to { stroke-dashoffset: -20; } }
      .flow-line { stroke-dasharray: 6 4; animation: dashAnim 1.2s linear infinite; }
    </style>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="300" fill="#0C0E12" rx="12" stroke="#1E232D" stroke-width="1.5"/>

  <!-- Top System Header Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="10" r="4" fill="#10B981"/>
    <text x="20" y="14" fill="#E2E8F0" font-size="12" font-weight="700" letter-spacing="1" class="mono-txt">
      DOUBLE-ENTRY LEDGER &amp; TWO-PHASE RESERVATION ENGINE
    </text>
    <text x="540" y="14" fill="#94A3B8" font-size="11" font-weight="500" class="mono-txt">
      SYSTEM INVARIANT:
    </text>
    <rect x="660" y="0" width="250" height="26" rx="4" fill="#151921" stroke="#2A303C"/>
    <text x="785" y="17" fill="#10B981" font-size="11" font-weight="600" text-anchor="middle" class="mono-txt">
      Σ DEBITS - Σ CREDITS = 0 (ACID)
    </text>
  </g>

  <!-- Flow Conduits between Stages -->
  <path d="M 235 160 L 260 160" stroke="#38BDF8" stroke-width="2" class="flow-line" marker-end="url(#arrow-cyan)"/>
  <path d="M 475 160 L 500 160" stroke="#10B981" stroke-width="2" class="flow-line" marker-end="url(#arrow-emerald)"/>
  <path d="M 715 160 L 740 160" stroke="#F59E0B" stroke-width="2" class="flow-line" marker-end="url(#arrow-amber)"/>

  <!-- STAGE 01: Ingress & Idempotency -->
  <g transform="translate(24, 60)">
    <rect width="210" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#38BDF8" font-size="11" font-weight="700" class="mono-txt">01 · INGRESS &amp; MUTEX</text>
    
    <!-- Item 1: Client Ingress -->
    <rect x="12" y="44" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="60" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">POST /v1/checkout</text>
    <text x="22" y="76" fill="#94A3B8" font-size="9" class="mono-txt">Payload: Idempotency-Key</text>

    <!-- Item 2: Redis Mutex Lock -->
    <rect x="12" y="96" width="186" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="114" fill="#38BDF8" font-size="11" font-weight="600" class="mono-txt">Redis SETNX (Lock)</text>
    <text x="22" y="128" fill="#94A3B8" font-size="9.5" class="mono-txt">TTL: 24h · Mutex Granted</text>
    <text x="22" y="140" fill="#10B981" font-size="9" class="mono-txt">Replay Blocked (Zero Dupes)</text>

    <!-- Item 3: Status -->
    <rect x="12" y="158" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">Ingress Latency SLA</text>
    <text x="22" y="190" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">&lt; 3.2ms (P99 Gate)</text>
  </g>

  <!-- STAGE 02: Two-Phase Balance Reservation -->
  <g transform="translate(264, 60)">
    <rect width="210" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#10B981" font-size="11" font-weight="700" class="mono-txt">02 · TWO-PHASE 2PC</text>
    
    <!-- Item 1: State Machine -->
    <rect x="12" y="44" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="60" fill="#94A3B8" font-size="9.5" class="mono-txt">Account State Transition</text>
    <text x="22" y="76" fill="#10B981" font-size="10.5" font-weight="600" class="mono-txt">AVAILABLE &rarr; RESERVED</text>

    <!-- Item 2: Concurrency Isolation -->
    <rect x="12" y="96" width="186" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="114" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">Optimistic Versioning</text>
    <text x="22" y="128" fill="#94A3B8" font-size="9.5" class="mono-txt">Compare-And-Swap (CAS)</text>
    <text x="22" y="140" fill="#F59E0B" font-size="9" class="mono-txt">Zero Overdraft Invariant</text>

    <!-- Item 3: Hold Timeout Engine -->
    <rect x="12" y="158" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">Hold Auto-Expiration</text>
    <text x="22" y="190" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">TTL: 15,000ms Reversion</text>
  </g>

  <!-- STAGE 03: Upstream Bank / Clearing Dispatch -->
  <g transform="translate(504, 60)">
    <rect width="210" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#F59E0B" font-size="11" font-weight="700" class="mono-txt">03 · CLEARING DISPATCH</text>
    
    <!-- Item 1: ISO 8583 Switch Relay -->
    <rect x="12" y="44" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="60" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">ISO 8583 / mTLS Mesh</text>
    <text x="22" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">Upstream PSP / Central Bank</text>

    <!-- Item 2: Timeout Circuit Breaker -->
    <rect x="12" y="96" width="186" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="114" fill="#F59E0B" font-size="11" font-weight="600" class="mono-txt">Timeout Circuit Breaker</text>
    <text x="22" y="128" fill="#94A3B8" font-size="9.5" class="mono-txt">Adaptive Exponential Jitter</text>
    <text x="22" y="140" fill="#38BDF8" font-size="9" class="mono-txt">Auto-Reverse on Rejection</text>

    <!-- Item 3: Confirmation -->
    <rect x="12" y="158" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">Capture Confirmation</text>
    <text x="22" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">200 OK / RRN: 8940122</text>
  </g>

  <!-- STAGE 04: Immutable Fact Store & Audit Log -->
  <g transform="translate(744, 60)">
    <rect width="192" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="192" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#E2E8F0" font-size="11" font-weight="700" class="mono-txt">04 · IMMUTABLE FACT</text>
    
    <!-- Item 1: Append-Only Fact Journal -->
    <rect x="12" y="44" width="168" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="20" y="60" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">ScyllaDB / Postgres</text>
    <text x="20" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">Append-Only Transactions</text>

    <!-- Item 2: Double-Entry Balancing -->
    <rect x="12" y="96" width="168" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="20" y="114" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">Dual Line Journal</text>
    <text x="20" y="128" fill="#94A3B8" font-size="9" class="mono-txt">Dr: Merchant +10,000,000</text>
    <text x="20" y="140" fill="#94A3B8" font-size="9" class="mono-txt">Cr: Customer -10,000,000</text>

    <!-- Item 3: Drift Zero Metric -->
    <rect x="12" y="158" width="168" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="20" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">Reconciliation Drift</text>
    <text x="20" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">0.00 IRR (Mathematical)</text>
  </g>
</svg>
