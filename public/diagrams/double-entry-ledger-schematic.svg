<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="auto" class="w-full h-auto" preserveAspectRatio="xMidYMid meet" dir="ltr" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="led-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="led-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c974" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e2c974" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="led-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02"/>
    </linearGradient>
    <pattern id="grid-dots-led-1000" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e2c974"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <style>
    text {
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1000" height="520" fill="#0b0e14" rx="14"/>
  <rect width="1000" height="520" fill="url(#grid-dots-led-1000)" rx="14"/>
  <rect width="998" height="518" x="1" y="1" fill="none" stroke="#ffffff" stroke-opacity="0.08" rx="13"/>

  <!-- Top Header & Invariant Status Bar -->
  <g transform="translate(32, 28)">
    <circle cx="6" cy="10" r="5" fill="#06b6d4"/>
    <text x="20" y="14" fill="#06b6d4" font-size="12" font-weight="700" letter-spacing="1.2">ARCHITECTURE SCHEMATIC · DOUBLE-ENTRY LEDGER ENGINE</text>
    <text x="20" y="30" fill="#94a3b8" font-size="9.5">DISTRIBUTED MUTEX · TWO-PHASE BALANCE RESERVATION · APPEND-ONLY AUDIT LOG</text>
    
    <!-- Right Header Invariant Badge -->
    <rect x="650" y="0" width="286" height="28" rx="6" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.35"/>
    <circle cx="664" cy="14" r="4" fill="#10b981"/>
    <text x="676" y="18" fill="#38bdf8" font-size="10" font-weight="700">INVARIANT: Σ DEBITS - Σ CREDITS = 0</text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 1: INGRESS & CONCURRENCY MUTEX LOCK (x=32, width=280)             -->
  <!-- ========================================================================= -->
  <g transform="translate(32, 85)">
    <!-- Outer Card -->
    <rect width="280" height="375" rx="10" fill="#111827" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect width="280" height="34" rx="10" fill="#ffffff" fill-opacity="0.04"/>
    <text x="16" y="22" fill="#e2c974" font-size="11.5" font-weight="700">01. MUTATION INGRESS &amp; MUTEX</text>

    <!-- Sub-card A: Ingress Request Payload -->
    <rect x="14" y="46" width="252" height="88" rx="6" fill="#0b0e14" stroke="#06b6d4" stroke-opacity="0.35"/>
    <text x="26" y="66" fill="#f8fafc" font-size="11" font-weight="700">POST /v1/wallet/reserve</text>
    <text x="26" y="83" fill="#94a3b8" font-size="9.5">Payload:</text>
    <text x="76" y="83" fill="#cbd5e1" font-size="9.5">{ amount: 2500000, curr: "IRR" }</text>
    <text x="26" y="100" fill="#94a3b8" font-size="9.5">Idempotency:</text>
    <text x="106" y="100" fill="#06b6d4" font-size="9.5" font-weight="600">tx_uuid_9942a_seq1</text>
    <text x="26" y="118" fill="#64748b" font-size="8.5">mTLS Edge · SHA-256 Nonce Verified</text>

    <!-- Sub-card B: Redis SETNX Atomic Mutex -->
    <rect x="14" y="142" width="252" height="110" rx="6" fill="#0b0e14" stroke="#e2c974" stroke-opacity="0.4"/>
    <text x="26" y="162" fill="#e2c974" font-size="11" font-weight="700">REDIS DISTRIBUTED LOCK</text>
    <text x="26" y="179" fill="#94a3b8" font-size="9.5">Primitive:</text>
    <text x="92" y="179" fill="#f8fafc" font-size="9.5" font-weight="600">SETNX lock:tx_uuid 1 EX 15</text>
    <text x="26" y="196" fill="#94a3b8" font-size="9.5">State:</text>
    <text x="68" y="196" fill="#10b981" font-size="9.5" font-weight="700">MUTEX_ACQUIRED (Token Lock)</text>
    <text x="26" y="213" fill="#94a3b8" font-size="9.5">Guardrail:</text>
    <text x="90" y="213" fill="#cbd5e1" font-size="9.5">Replay Window 86,400s (24h)</text>
    <text x="26" y="233" fill="#e2c974" font-size="8.5">Duplicate Post-Requests Dropped Instantly</text>

    <!-- Sub-card C: Memory State Cache -->
    <rect x="14" y="260" width="252" height="98" rx="6" fill="#0b0e14" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="26" y="280" fill="#f8fafc" font-size="11" font-weight="600">TRANSIENT INGRESS BUFFER</text>
    <text x="26" y="298" fill="#94a3b8" font-size="9.5">State Node:</text>
    <text x="96" y="298" fill="#38bdf8" font-size="9.5" font-weight="600">PENDING_RESERVE</text>
    <text x="26" y="315" fill="#94a3b8" font-size="9.5">Isolation:</text>
    <text x="90" y="315" fill="#cbd5e1" font-size="9.5">Read-Committed Snapshot</text>
    <text x="26" y="336" fill="#64748b" font-size="8.5">Optimistic Lock Version v1.442 · Hot Cache</text>
  </g>

  <!-- Conduit: Column 1 -> Column 2 -->
  <path d="M 312 185 L 348 185" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr-cyan)"/>
  <rect x="314" y="167" width="32" height="16" rx="3" fill="#0b0e14" stroke="#06b6d4" stroke-opacity="0.5"/>
  <text x="320" y="179" fill="#06b6d4" font-size="8.5" font-weight="700">2PC</text>

  <!-- ========================================================================= -->
  <!-- COLUMN 2: TWO-PHASE BALANCE RESERVATION ENGINE (x=350, width=320)         -->
  <!-- ========================================================================= -->
  <g transform="translate(350, 85)">
    <!-- Outer Card -->
    <rect width="320" height="375" rx="10" fill="#111827" fill-opacity="0.85" stroke="#06b6d4" stroke-opacity="0.4"/>
    <rect width="320" height="34" rx="10" fill="url(#led-cyan-grad)"/>
    <text x="16" y="22" fill="#38bdf8" font-size="11.5" font-weight="700">02. TWO-PHASE RESERVATION ENGINE</text>

    <!-- State 1: Available Pool -->
    <rect x="14" y="46" width="292" height="72" rx="6" fill="#0b0e14" stroke="#10b981" stroke-opacity="0.45"/>
    <circle cx="28" cy="68" r="5" fill="#10b981"/>
    <text x="40" y="72" fill="#f8fafc" font-size="11.5" font-weight="700">AVAILABLE: $1,000.00</text>
    <text x="40" y="89" fill="#94a3b8" font-size="9.5">Unrestricted user balance pool · Ready to spend</text>
    <text x="40" y="104" fill="#64748b" font-size="8.5">ACID Invariant: Available &gt;= Hold Amount</text>

    <!-- Arrow down to Reserved -->
    <path d="M 160 118 L 160 138" fill="none" stroke="#e2c974" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arr-gold)"/>
    <rect x="100" y="121" width="120" height="16" rx="3" fill="#0b0e14" stroke="#e2c974" stroke-opacity="0.5"/>
    <text x="108" y="132" fill="#e2c974" font-size="9" font-weight="700">HOLD $250.00 (2PC)</text>

    <!-- State 2: Reserved Ring-Fenced State -->
    <rect x="14" y="138" width="292" height="88" rx="6" fill="#0b0e14" stroke="#e2c974" stroke-opacity="0.55"/>
    <circle cx="28" cy="158" r="5" fill="#e2c974"/>
    <text x="40" y="162" fill="#e2c974" font-size="11.5" font-weight="700">RESERVED: $250.00</text>
    <text x="40" y="179" fill="#94a3b8" font-size="9.5">Ring-fenced escrow during payment switch auth</text>
    <text x="40" y="195" fill="#cbd5e1" font-size="9">Remaining Available: </text>
    <text x="156" y="195" fill="#10b981" font-size="9" font-weight="700">$750.00</text>
    <text x="40" y="210" fill="#64748b" font-size="8.5">Locked state machine: cannot double-spend</text>

    <!-- Bifurcation Paths: Success vs Timeout -->
    <path d="M 85 226 L 85 250" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arr-emerald)"/>
    <path d="M 235 226 L 235 250" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arr-rose)"/>

    <!-- Branch A: Commit & Settle -->
    <rect x="14" y="250" width="140" height="110" rx="6" fill="#0b0e14" stroke="#10b981" stroke-opacity="0.45"/>
    <text x="24" y="270" fill="#10b981" font-size="11" font-weight="700">COMMIT / SETTLE</text>
    <text x="24" y="288" fill="#94a3b8" font-size="9">Trigger: </text>
    <text x="68" y="288" fill="#cbd5e1" font-size="9" font-weight="600">AuthConfirmed</text>
    <text x="24" y="304" fill="#94a3b8" font-size="9">Action: </text>
    <text x="66" y="304" fill="#38bdf8" font-size="9">Burn Reserve</text>
    <text x="24" y="320" fill="#94a3b8" font-size="9">Payout: </text>
    <text x="68" y="320" fill="#10b981" font-size="9">Credit Merchant</text>
    <text x="24" y="340" fill="#10b981" font-size="8.5" font-weight="700">STATUS: COMMITTED</text>

    <!-- Branch B: Rollback & Compensate -->
    <rect x="166" y="250" width="140" height="110" rx="6" fill="#0b0e14" stroke="#f43f5e" stroke-opacity="0.45"/>
    <text x="176" y="270" fill="#f43f5e" font-size="11" font-weight="700">ROLLBACK / 0400</text>
    <text x="176" y="288" fill="#94a3b8" font-size="9">Trigger: </text>
    <text x="220" y="288" fill="#cbd5e1" font-size="9" font-weight="600">Host Timeout</text>
    <text x="176" y="304" fill="#94a3b8" font-size="9">Action: </text>
    <text x="218" y="304" fill="#e2c974" font-size="9">Release Hold</text>
    <text x="176" y="320" fill="#94a3b8" font-size="9">Payout: </text>
    <text x="220" y="320" fill="#cbd5e1" font-size="9">Refund $250</text>
    <text x="176" y="340" fill="#f43f5e" font-size="8.5" font-weight="700">STATUS: REVERSED</text>
  </g>

  <!-- Conduit: Column 2 -> Column 3 -->
  <path d="M 670 185 L 702 185" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arr-cyan)"/>
  <rect x="672" y="167" width="28" height="16" rx="3" fill="#0b0e14" stroke="#06b6d4" stroke-opacity="0.5"/>
  <text x="676" y="179" fill="#06b6d4" font-size="8.5" font-weight="700">CDC</text>

  <!-- ========================================================================= -->
  <!-- COLUMN 3: APPEND-ONLY IMMUTABLE JOURNAL (x=704, width=264)               -->
  <!-- ========================================================================= -->
  <g transform="translate(704, 85)">
    <!-- Outer Card -->
    <rect width="264" height="375" rx="10" fill="#111827" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect width="264" height="34" rx="10" fill="#ffffff" fill-opacity="0.04"/>
    <text x="16" y="22" fill="#e2c974" font-size="11.5" font-weight="700">03. IMMUTABLE JOURNAL</text>

    <!-- Table Column Headers -->
    <rect x="12" y="46" width="240" height="24" rx="4" fill="#0b0e14"/>
    <text x="18" y="62" fill="#94a3b8" font-size="8.5" font-weight="700">EVENT / ACCOUNT</text>
    <text x="136" y="62" fill="#94a3b8" font-size="8.5" font-weight="700">DEBIT (DR)</text>
    <text x="194" y="62" fill="#94a3b8" font-size="8.5" font-weight="700">CREDIT (CR)</text>

    <!-- Row 1: AuthHold -->
    <rect x="12" y="74" width="240" height="38" rx="4" fill="#0b0e14" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="18" y="89" fill="#38bdf8" font-size="9" font-weight="700">E1: AuthHold</text>
    <text x="18" y="103" fill="#94a3b8" font-size="8">User:CashPool</text>
    <text x="136" y="97" fill="#f8fafc" font-size="9.5" font-weight="600">$250.00</text>
    <text x="202" y="97" fill="#64748b" font-size="9.5">—</text>

    <!-- Row 2: EscrowLock -->
    <rect x="12" y="116" width="240" height="38" rx="4" fill="#0b0e14" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="18" y="131" fill="#e2c974" font-size="9" font-weight="700">E2: EscrowLock</text>
    <text x="18" y="145" fill="#94a3b8" font-size="8">Vault:Reserved</text>
    <text x="146" y="139" fill="#64748b" font-size="9.5">—</text>
    <text x="194" y="139" fill="#f8fafc" font-size="9.5" font-weight="600">$250.00</text>

    <!-- Row 3: CaptureSettle -->
    <rect x="12" y="158" width="240" height="38" rx="4" fill="#0b0e14" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="18" y="173" fill="#10b981" font-size="9" font-weight="700">E3: CaptureSettle</text>
    <text x="18" y="187" fill="#94a3b8" font-size="8">Merchant:Settled</text>
    <text x="146" y="181" fill="#64748b" font-size="9.5">—</text>
    <text x="194" y="181" fill="#10b981" font-size="9.5" font-weight="700">$250.00</text>

    <!-- Row 4: SwitchFee -->
    <rect x="12" y="200" width="240" height="38" rx="4" fill="#0b0e14" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="18" y="215" fill="#38bdf8" font-size="9" font-weight="700">E4: SwitchFee</text>
    <text x="18" y="229" fill="#94a3b8" font-size="8">Network:FeePool</text>
    <text x="136" y="223" fill="#f8fafc" font-size="9.5" font-weight="600">$2.50</text>
    <text x="194" y="223" fill="#f8fafc" font-size="9.5" font-weight="600">$2.50</text>

    <!-- Audit Proof Box -->
    <rect x="12" y="246" width="240" height="114" rx="6" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-opacity="0.35"/>
    <circle cx="24" cy="263" r="4" fill="#10b981"/>
    <text x="34" y="267" fill="#38bdf8" font-size="9.5" font-weight="700">AUDIT VERIFICATION · ZERO DRIFT</text>
    <line x1="20" y1="277" x2="244" y2="277" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="20" y="293" fill="#94a3b8" font-size="9">Total Debits (DR):</text>
    <text x="160" y="293" fill="#f8fafc" font-size="9.5" font-weight="700">$252.50</text>
    <text x="20" y="310" fill="#94a3b8" font-size="9">Total Credits (CR):</text>
    <text x="160" y="310" fill="#f8fafc" font-size="9.5" font-weight="700">$252.50</text>
    <text x="20" y="328" fill="#10b981" font-size="9.5" font-weight="700">DELTA: $0.000000 (PARITY)</text>
    <text x="20" y="345" fill="#64748b" font-size="8.5">Zero Ghost Balances · Central Bank Ready</text>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM FOOTER PROTOCOL SPECIFICATION BAR                                  -->
  <!-- ========================================================================= -->
  <g transform="translate(32, 482)">
    <line x1="0" y1="0" x2="936" y2="0" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="6" cy="18" r="3" fill="#10b981"/>
    <text x="16" y="22" fill="#94a3b8" font-size="9.5">PROTOCOL: SHARED RAFT CONSENSUS · SCYLLADB APPEND-ONLY FACT STORE · TRANSACTIONAL OUTBOX CDC</text>
    <rect x="770" y="6" width="166" height="24" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="778" y="22" fill="#10b981" font-size="9" font-weight="700">ZERO BALANCE OVERWRITE</text>
  </g>
</svg>
