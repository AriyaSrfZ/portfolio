      <stop offset="0%" stop-color="#151921"/>
      <stop offset="100%" stop-color="#0f1217"/>
    </linearGradient>

    <linearGradient id="recon-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="recon-arr-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="recon-arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4"/>
    </marker>
    <marker id="recon-arr-gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e2c974"/>
    </marker>

    <!-- Flow Animation -->
    <style>
      @keyframes reconFlow { to { stroke-dashoffset: -28; } }
      .recon-conduit-emerald { stroke: #10b981; stroke-width: 1.75; stroke-dasharray: 6 4; animation: reconFlow 1.6s linear infinite; }
      .recon-conduit-cyan { stroke: #06b6d4; stroke-width: 1.75; stroke-dasharray: 6 4; animation: reconFlow 1.6s linear infinite; }
      text { font-family: 'IBM Plex Mono', system-ui, -apple-system, monospace; }
      .code-font { font-family: 'IBM Plex Mono', monospace; }
    </style>
