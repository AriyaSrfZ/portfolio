<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b90a8"/>
    </marker>
    <linearGradient id="grad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="900" height="380" fill="#0b0e17"/>
  <text x="450" y="35" text-anchor="middle" fill="#e8eaf2" font-family="sans-serif" font-size="18" font-weight="bold">Card-to-Card Settlement Across 22 Banks, No Bank Backing</text>

  <g font-family="sans-serif" font-size="12" fill="#e8eaf2">
    <rect x="30" y="70" width="140" height="45" rx="8" fill="#151a2b" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="100" y="97" text-anchor="middle">Bank A</text>
    <rect x="30" y="130" width="140" height="45" rx="8" fill="#151a2b" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="100" y="157" text-anchor="middle">Bank B</text>
    <rect x="30" y="190" width="140" height="45" rx="8" fill="#151a2b" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="100" y="217" text-anchor="middle">Bank C</text>
    <rect x="30" y="250" width="140" height="45" rx="8" fill="#151a2b" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="100" y="277" text-anchor="middle" font-size="11" fill="#c7cadb">+ 19 more, each</text>

    <line x1="170" y1="92" x2="240" y2="170" stroke="#8b90a8" stroke-width="1.3" marker-end="url(#arrow3)"/>
    <line x1="170" y1="152" x2="240" y2="175" stroke="#8b90a8" stroke-width="1.3" marker-end="url(#arrow3)"/>
    <line x1="170" y1="212" x2="240" y2="185" stroke="#8b90a8" stroke-width="1.3" marker-end="url(#arrow3)"/>
    <line x1="170" y1="272" x2="240" y2="195" stroke="#8b90a8" stroke-width="1.3" marker-end="url(#arrow3)"/>

    <rect x="245" y="140" width="190" height="70" rx="10" fill="#151a2b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="340" y="167" text-anchor="middle" font-weight="bold">Normalization layer</text>
    <text x="340" y="185" text-anchor="middle" font-size="10.5" fill="#c7cadb">unifies error codes,</text>
    <text x="340" y="200" text-anchor="middle" font-size="10.5" fill="#c7cadb">timeouts, state machines</text>

    <line x1="435" y1="175" x2="490" y2="175" stroke="#8b90a8" stroke-width="2" marker-end="url(#arrow3)"/>

    <rect x="495" y="140" width="190" height="70" rx="10" fill="url(#grad3)" opacity="0.85"/>
    <text x="590" y="167" text-anchor="middle" font-weight="bold">Reconciliation engine</text>
    <text x="590" y="185" text-anchor="middle" font-size="10.5">pardakht-yari settlement</text>
    <text x="590" y="200" text-anchor="middle" font-size="10.5">layer, no bank backing</text>

    <line x1="685" y1="175" x2="740" y2="175" stroke="#8b90a8" stroke-width="2" marker-end="url(#arrow3)"/>

    <rect x="745" y="150" width="130" height="50" rx="10" fill="#151a2b" stroke="#22c3a6" stroke-width="1.5"/>
    <text x="810" y="171" text-anchor="middle" font-size="11" font-weight="bold" fill="#22c3a6">Zero-discrepancy</text>
    <text x="810" y="187" text-anchor="middle" font-size="11" fill="#22c3a6">settlement</text>
  </g>

  <text x="450" y="335" text-anchor="middle" fill="#8b90a8" font-family="sans-serif" font-size="12">Scaled from ~100 users to 30 million on this same core architecture</text>
</svg>
