<?xml version="1.0" encoding="UTF-8"?>
<svg 
  xmlns="http://www.w3.org/2000/svg" 
  class="w-full h-auto" 
  viewBox="0 0 960 300" 
  preserveAspectRatio="xMidYMid meet"
  shape-rendering="geometricPrecision" 
  text-rendering="geometricPrecision"
  dir="ltr"
>
  <defs>
    <style>
      .mono-txt { font-family: 'Geist Mono', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; }
      @keyframes dashAnim { to { stroke-dashoffset: -20; } }
      .flow-line { stroke-dasharray: 6 4; animation: dashAnim 1.2s linear infinite; }
    </style>
    <marker id="arrow-emerald-rec" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-cyan-rec" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-amber-rec" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="300" fill="#0C0E12" rx="12" stroke="#1E232D" stroke-width="1.5"/>

  <!-- Top System Header Bar -->
  <g transform="translate(24, 20)">
    <circle cx="6" cy="10" r="4" fill="#10B981"/>
    <text x="20" y="14" fill="#E2E8F0" font-size="12" font-weight="700" letter-spacing="1" class="mono-txt">
      MULTI-BANK 3-WAY RECONCILIATION &amp; EARLY SETTLEMENT ENGINE
    </text>
    <text x="590" y="14" fill="#94A3B8" font-size="11" font-weight="500" class="mono-txt">
      BATCH DRIFT:
    </text>
    <rect x="680" y="0" width="230" height="26" rx="4" fill="#151921" stroke="#2A303C"/>
    <text x="795" y="17" fill="#10B981" font-size="11" font-weight="600" text-anchor="middle" class="mono-txt">
      0.00% DRIFT · 50K BATCHES
    </text>
  </g>

  <!-- Flow Conduits between Stages -->
  <path d="M 235 160 L 260 160" stroke="#38BDF8" stroke-width="2" class="flow-line" marker-end="url(#arrow-cyan-rec)"/>
  <path d="M 475 160 L 500 160" stroke="#10B981" stroke-width="2" class="flow-line" marker-end="url(#arrow-emerald-rec)"/>
  <path d="M 715 160 L 740 160" stroke="#F59E0B" stroke-width="2" class="flow-line" marker-end="url(#arrow-amber-rec)"/>

  <!-- STAGE 01: Bank Feeds & SFTP Ingestion -->
  <g transform="translate(24, 60)">
    <rect width="210" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#38BDF8" font-size="11" font-weight="700" class="mono-txt">01 · INGESTION FEEDS</text>
    
    <!-- Item 1: Feed Protocol -->
    <rect x="12" y="44" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="60" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">ISO 20022 / MT940</text>
    <text x="22" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">Automated Daily SFTP Pull</text>

    <!-- Item 2: Banking Connectors -->
    <rect x="12" y="96" width="186" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="114" fill="#38BDF8" font-size="11" font-weight="600" class="mono-txt">12+ Bank Connectors</text>
    <text x="22" y="128" fill="#94A3B8" font-size="9.5" class="mono-txt">Shaparak Clearing Statements</text>
    <text x="22" y="140" fill="#10B981" font-size="9" class="mono-txt">Raw Data Parsed &amp; Validated</text>

    <!-- Item 3: Volume -->
    <rect x="12" y="158" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">Daily Clearing Volume</text>
    <text x="22" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">&gt; 5,000,000 Tx / Day</text>
  </g>

  <!-- STAGE 02: ETL & Normalization Pipeline -->
  <g transform="translate(264, 60)">
    <rect width="210" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#10B981" font-size="11" font-weight="700" class="mono-txt">02 · ETL &amp; CANONICAL</text>
    
    <!-- Item 1: Harmonization -->
    <rect x="12" y="44" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="60" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">Schema Harmonization</text>
    <text x="22" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">STAN + RRN Composite Key</text>

    <!-- Item 2: Dedup & Token Hash -->
    <rect x="12" y="96" width="186" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="114" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">Deduplication Gate</text>
    <text x="22" y="128" fill="#94A3B8" font-size="9.5" class="mono-txt">SHA-256 Digest Fingerprint</text>
    <text x="22" y="140" fill="#E2E8F0" font-size="9" class="mono-txt">Spring Batch Multi-threaded</text>

    <!-- Item 3: Pipeline Throughput -->
    <rect x="12" y="158" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">Processing Pipeline Speed</text>
    <text x="22" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">45,000 Records / Sec</text>
  </g>

  <!-- STAGE 03: 3-Way Match & Auto-Healing -->
  <g transform="translate(504, 60)">
    <rect width="210" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#F59E0B" font-size="11" font-weight="700" class="mono-txt">03 · 3-WAY MATCHER</text>
    
    <!-- Item 1: 3-Way Matching Engine -->
    <rect x="12" y="44" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="60" fill="#E2E8F0" font-size="11" font-weight="600" class="mono-txt">3-Way Verification</text>
    <text x="22" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">Internal &harr; PSP &harr; Shaparak</text>

    <!-- Item 2: Auto-Healing Refund Engine -->
    <rect x="12" y="96" width="186" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="114" fill="#F59E0B" font-size="11" font-weight="600" class="mono-txt">Auto-Healing Engine</text>
    <text x="22" y="128" fill="#94A3B8" font-size="9.5" class="mono-txt">Reverses Uncaptured Auth</text>
    <text x="22" y="140" fill="#10B981" font-size="9" class="mono-txt">Zero Manual Intervention</text>

    <!-- Item 3: Reconciliation Accuracy -->
    <rect x="12" y="158" width="186" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="22" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">Balancing Accuracy</text>
    <text x="22" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">100.00% Zero Variance</text>
  </g>

  <!-- STAGE 04: Early Payout & Settlement -->
  <g transform="translate(744, 60)">
    <rect width="192" height="215" rx="8" fill="#151921" stroke="#2A303C" stroke-width="1.5"/>
    <rect x="0" y="0" width="192" height="32" rx="8" fill="#1A202C"/>
    <text x="14" y="20" fill="#E2E8F0" font-size="11" font-weight="700" class="mono-txt">04 · EARLY SETTLE</text>
    
    <!-- Item 1: ACH Payout Batches -->
    <rect x="12" y="44" width="168" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="20" y="60" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">Paya / Satna ACH</text>
    <text x="20" y="76" fill="#94A3B8" font-size="9.5" class="mono-txt">Automated Cycle Dispatch</text>

    <!-- Item 2: Dynamic Floating Fee -->
    <rect x="12" y="96" width="168" height="52" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="20" y="114" fill="#38BDF8" font-size="11" font-weight="600" class="mono-txt">Dynamic Time Fee</text>
    <text x="20" y="128" fill="#94A3B8" font-size="9" class="mono-txt">&Delta;Fee = Amt &times; (r_base + d&times;r_d)</text>
    <text x="20" y="140" fill="#F59E0B" font-size="9" class="mono-txt">Merchant Liquidity Boost</text>

    <!-- Item 3: Dispute Queue -->
    <rect x="12" y="158" width="168" height="42" rx="5" fill="#0C0E12" stroke="#2A303C"/>
    <text x="20" y="175" fill="#94A3B8" font-size="9.5" class="mono-txt">T+2 Dispute Queue</text>
    <text x="20" y="190" fill="#10B981" font-size="11" font-weight="600" class="mono-txt">Automated Judicial Hold</text>
  </g>
</svg>