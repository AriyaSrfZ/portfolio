<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid-mfe" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    <style>
      text { font-family: 'IBM Plex Mono', system-ui, -apple-system, monospace; user-select: none; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="480" fill="#0b1120" rx="10"/>
  <rect width="880" height="480" fill="url(#grid-mfe)" rx="10"/>
  <rect x="0.5" y="0.5" width="879" height="479" stroke="#334155" stroke-width="1" rx="10"/>

  <!-- Tactical Header -->
  <line x1="16" y1="42" x2="864" y2="42" stroke="#334155" stroke-width="1"/>
  <rect x="24" y="18" width="8" height="8" fill="#06b6d4" rx="2"/>
  <text x="40" y="26" fill="#06b6d4" font-size="11" font-weight="700" letter-spacing="1">MEASUREMENT // FRAMEWORK-04</text>
  <text x="310" y="26" fill="#94a3b8" font-size="10" letter-spacing="0.5">TELEMETRY &amp; ATTRIBUTION: PROTOCOL DLR vs COGNITIVE ATTENTION</text>
  <rect x="735" y="14" width="125" height="20" fill="#111827" stroke="#334155" rx="4"/>
  <text x="745" y="28" fill="#f43f5e" font-size="9" font-weight="700">MYTH DECONSTRUCTION</text>

  <!-- 4-TIER FUNNEL CARDS -->
  <g id="funnel-cards-en">
    <!-- Tier 1 -->
    <rect x="30" y="58" width="195" height="210" fill="#111827" stroke="#3b82f6" stroke-width="1.2" rx="6"/>
    <rect x="30" y="58" width="195" height="24" fill="#1d4ed8" rx="6"/>
    <text x="127" y="74" fill="#ffffff" font-size="8.5" font-weight="700" text-anchor="middle">1. NETWORK PROTOCOL DLR</text>

    <text x="42" y="104" fill="#38bdf8" font-size="9.5" font-weight="700">STATUS: DELIVRD (~97%)</text>
    <text x="42" y="122" fill="#e2e8f0" font-size="8">PDU acknowledgment returned from BTS cellular tower and device baseband modem.</text>
    <rect x="42" y="144" width="171" height="42" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="50" y="158" fill="#10b981" font-size="7.5" font-weight="700">Verifiable Signal:</text>
    <text x="50" y="174" fill="#94a3b8" font-size="7">Packet reached handset radio chip</text>

    <text x="42" y="202" fill="#f43f5e" font-size="7.5" font-weight="700">Protocol Limitation:</text>
    <text x="42" y="218" fill="#94a3b8" font-size="7">GSM standard provides zero signal of human awareness or screen view.</text>
    <text x="42" y="246" fill="#64748b" font-size="7.5">Tool: SMPP deliver_sm receipt</text>

    <!-- Connector 1->2 -->
    <path d="M 225 163 L 245 163" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Tier 2 -->
    <rect x="245" y="58" width="195" height="210" fill="#111827" stroke="#06b6d4" stroke-width="1.2" rx="6"/>
    <rect x="245" y="58" width="195" height="24" fill="#0891b2" rx="6"/>
    <text x="342" y="74" fill="#ffffff" font-size="8.5" font-weight="700" text-anchor="middle">2. OPERATING SYSTEM (OS)</text>

    <text x="257" y="104" fill="#22d3ee" font-size="9.5" font-weight="700">NOTIFICATION GLANCE</text>
    <text x="257" y="122" fill="#e2e8f0" font-size="8">Alert populates in lock screen banner, persistent drawer, or Apple Watch glance.</text>
    <rect x="257" y="144" width="171" height="42" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="265" y="158" fill="#e2c974" font-size="7.5" font-weight="700">User Behavior:</text>
    <text x="265" y="174" fill="#94a3b8" font-size="7">Passive glance without opening app</text>

    <text x="257" y="202" fill="#f43f5e" font-size="7.5" font-weight="700">Ghost Consumption:</text>
    <text x="257" y="218" fill="#94a3b8" font-size="7">OTP code copied or banner swiped away; zero upstream telemetry emitted.</text>
    <text x="257" y="246" fill="#64748b" font-size="7.5">Tool: Client OS internal memory</text>

    <!-- Connector 2->3 -->
    <path d="M 440 163 L 460 163" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Tier 3 -->
    <rect x="460" y="58" width="195" height="210" fill="#111827" stroke="#e2c974" stroke-width="1.2" rx="6"/>
    <rect x="460" y="58" width="195" height="24" fill="#ca8a04" rx="6"/>
    <text x="557" y="74" fill="#0b1120" font-size="8.5" font-weight="700" text-anchor="middle">3. CLIENT MESSAGES APP</text>

    <text x="472" y="104" fill="#facc15" font-size="9.5" font-weight="700">THREAD EXPANSION</text>
    <text x="472" y="122" fill="#e2e8f0" font-size="8">User actively opens the default SMS app and taps into the sender conversation thread.</text>
    <rect x="472" y="144" width="171" height="42" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="480" y="158" fill="#e2c974" font-size="7.5" font-weight="700">Survey Estimates:</text>
    <text x="480" y="174" fill="#94a3b8" font-size="7">Vendor surveys cite 85–92% recall</text>

    <text x="472" y="202" fill="#f43f5e" font-size="7.5" font-weight="700">Methodological Flaw:</text>
    <text x="472" y="218" fill="#94a3b8" font-size="7">Self-reported survey recollection, not server-verifiable technical telemetry.</text>
    <text x="472" y="246" fill="#64748b" font-size="7.5">Tool: Subjective post-campaign survey</text>

    <!-- Connector 3->4 -->
    <path d="M 655 163 L 675 163" stroke="#e2c974" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Tier 4 -->
    <rect x="675" y="58" width="175" height="210" fill="#111827" stroke="#10b981" stroke-width="1.2" rx="6"/>
    <rect x="675" y="58" width="175" height="24" fill="#059669" rx="6"/>
    <text x="762" y="74" fill="#ffffff" font-size="8.5" font-weight="700" text-anchor="middle">4. DOWNSTREAM ATTRIBUTION</text>

    <text x="687" y="104" fill="#34d399" font-size="9.5" font-weight="700">CLICK &amp; CONVERSION</text>
    <text x="687" y="122" fill="#e2e8f0" font-size="8">The only engineering-verifiable signal logged directly on enterprise servers.</text>
    <rect x="687" y="144" width="151" height="42" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="695" y="158" fill="#10b981" font-size="7.5" font-weight="700">Verifiable Metrics:</text>
    <text x="695" y="174" fill="#94a3b8" font-size="7">Shortlink CTR, OTP verify, orders</text>

    <text x="687" y="202" fill="#10b981" font-size="7.5" font-weight="700">Real Benchmark CTR:</text>
    <text x="687" y="218" fill="#94a3b8" font-size="7">2% to 9% CTR across genuine commercial campaigns.</text>
    <text x="687" y="246" fill="#64748b" font-size="7.5">Tool: Hashed shortlink + UTM token</text>
  </g>

  <!-- CRITICAL MYTH BUSTING BOX -->
  <g id="myth-busting-en">
    <rect x="30" y="284" width="820" height="180" fill="#111827" stroke="#334155" rx="8"/>
    <rect x="30" y="284" width="280" height="24" fill="#1e293b" rx="8"/>
    <text x="170" y="300" fill="#f8fafc" font-size="8.5" font-weight="700" text-anchor="middle">ANATOMY OF THE "98% OPEN RATE" MARKETING MYTH</text>

    <!-- Left Box: The Myth -->
    <rect x="46" y="318" width="370" height="132" fill="#1f1315" stroke="#991b1b" stroke-width="1" rx="6"/>
    <text x="60" y="338" fill="#f87171" font-size="10" font-weight="700">The Vendor Marketing Myth:</text>
    <text x="60" y="356" fill="#fca5a5" font-size="8.5">"98% of SMS messages are opened and read within 3 minutes!"</text>
    <text x="60" y="374" fill="#e2e8f0" font-size="7.5">Origin: Traced to an unscientific 2010 mobile marketing sales deck, recycled indefinitely.</text>
    <text x="60" y="390" fill="#cbd5e1" font-size="7.5">Category Error: Conflates radio-level modem delivery (DLR) with human cognitive reading.</text>
    <text x="60" y="406" fill="#cbd5e1" font-size="7.5">Modern Reality: Automated spam filters on iOS/Android route unverified numbers into junk folders.</text>
    <text x="60" y="428" fill="#fca5a5" font-size="7.5" font-weight="700">Consequence: Distorts enterprise CAC and ROI forecasting models.</text>

    <!-- Right Box: The Reality -->
    <rect x="434" y="318" width="400" height="132" fill="#0f1d18" stroke="#065f46" stroke-width="1" rx="6"/>
    <text x="448" y="338" fill="#34d399" font-size="10" font-weight="700">Rigorous Systems Telemetry &amp; GSM Reality:</text>
    <text x="448" y="356" fill="#6ee7b7" font-size="8.5">SMPP DELIVRD confirms baseband packet arrival—nothing more.</text>
    <text x="448" y="374" fill="#e2e8f0" font-size="7.5">GSM 03.40 / 3GPP specs define no read receipt protocol for standard SMS.</text>
    <text x="448" y="390" fill="#cbd5e1" font-size="7.5">True measurement requires server-side attribution: Unique hashed URL redirect telemetry.</text>
    <text x="448" y="406" fill="#cbd5e1" font-size="7.5">Conversion efficacy hinges on targeting relevance, verified identity, and prompt delivery latency.</text>
    <text x="448" y="428" fill="#34d399" font-size="7.5" font-weight="700">Recommendation: Base executive decisions on CTR and conversion, not open-rate vanity.</text>
  </g>
</svg>
