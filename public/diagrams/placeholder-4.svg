<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid-p4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <style>
      text {
        font-family: 'IBM Plex Mono', monospace;
        user-select: none;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="740" height="340" fill="#0b1120" rx="12"/>
  <rect width="740" height="340" fill="url(#grid-p4)" rx="6"/>

  <!-- Outer Frame & Tactical Reticle -->
  <rect x="0.5" y="0.5" width="739" height="339" stroke="#334155" stroke-width="1" rx="12"/>
  <rect x="8" y="8" width="724" height="324" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" rx="6"/>

  <!-- Tactical Corner Crosshairs -->
  <path d="M 4 14 L 4 4 L 14 4" stroke="#e2c974" stroke-width="1.5" fill="none"/>
  <path d="M 726 4 L 736 4 L 736 14" stroke="#e2c974" stroke-width="1.5" fill="none"/>
  <path d="M 4 326 L 4 336 L 14 336" stroke="#e2c974" stroke-width="1.5" fill="none"/>
  <path d="M 726 336 L 736 336 L 736 326" stroke="#e2c974" stroke-width="1.5" fill="none"/>

  <!-- Telemetry Header Bar -->
  <line x1="8" y1="36" x2="732" y2="36" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
  <rect x="18" y="16" width="6" height="6" fill="#06b6d4" rx="6"/>
  <text x="32" y="23" fill="#06b6d4" font-size="9" font-weight="700" letter-spacing="1.5">SPEC-ID: 8409-AS · 04 · SMART DB v1 DATA PIPELINE</text>
  <text x="440" y="23" fill="#94a3b8" font-size="8" letter-spacing="0.5">100M CONTACT CONSOLIDATION</text>
  <rect x="620" y="13" width="102" height="17" fill="#111827" stroke="#334155" stroke-width="1" rx="6"/>
  <rect x="626" y="18" width="6" height="6" fill="#10b981" rx="6"/>
  <text x="638" y="24" fill="#10b981" font-size="7.5" font-weight="700" letter-spacing="0.5">SCALE: 100M RECS</text>

  <!-- ================= MODULE 01: RAW INGESTION ================= -->
  <g id="mod-raw">
    <rect x="24" y="60" width="144" height="190" fill="#111827" stroke="#06b6d4" stroke-width="1.5" rx="6"/>
    <rect x="24" y="60" width="144" height="24" fill="#06b6d4" rx="6"/>
    <text x="96" y="76" fill="#0b1120" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">01 · RAW INGESTION</text>
    
    <text x="96" y="105" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">UNSTRUCTURED DUMPS</text>
    <text x="96" y="122" fill="#06b6d4" font-size="8.5" font-weight="700" text-anchor="middle">94.7M Sparse Rows</text>
    
    <line x1="36" y1="135" x2="156" y2="135" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2"/>
    
    <text x="96" y="152" fill="#94a3b8" font-size="7.5" text-anchor="middle">Operator TSV/CSV Dumps</text>
    <text x="96" y="168" fill="#94a3b8" font-size="7.5" text-anchor="middle">Inconsistent Schema Map</text>
    <text x="96" y="184" fill="#e2c974" font-size="7.5" text-anchor="middle">Missing Honorifics &amp; Titles</text>
    <text x="96" y="200" fill="#94a3b8" font-size="7.5" text-anchor="middle">Phonetic Variations</text>
    
    <rect x="36" y="215" width="120" height="20" fill="#0b1120" stroke="#334155" stroke-width="1" rx="6"/>
    <text x="96" y="228" fill="#10b981" font-size="7" font-weight="700" text-anchor="middle">INGEST: COMPLETE</text>
  </g>

  <!-- Conduit 1 -> 2 -->
  <path d="M 168 155 L 202 155" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="204,155 194,150 194,160" fill="#06b6d4"/>
  <text x="186" y="145" fill="#06b6d4" font-size="7" font-weight="700" text-anchor="middle">STREAM</text>

  <!-- ================= MODULE 02: DUCKDB VECTOR ENGINE ================= -->
  <g id="mod-duckdb">
    <rect x="204" y="60" width="150" height="190" fill="#111827" stroke="#e2c974" stroke-width="1.5" rx="6"/>
    <rect x="204" y="60" width="150" height="24" fill="#e2c974" rx="6"/>
    <text x="279" y="76" fill="#0b1120" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">02 · VECTOR ENGINE</text>
    
    <text x="279" y="105" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">DUCKDB VECTORIZED</text>
    <text x="279" y="122" fill="#e2c974" font-size="8.5" font-weight="700" text-anchor="middle">In-Memory Columnar</text>
    
    <line x1="216" y1="135" x2="342" y2="135" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2"/>
    
    <text x="279" y="152" fill="#f8fafc" font-size="7.5" text-anchor="middle">PyArrow Worker Pipeline</text>
    <text x="279" y="168" fill="#94a3b8" font-size="7.5" text-anchor="middle">Multi-Attribute Joins</text>
    <text x="279" y="184" fill="#e2c974" font-size="7.5" text-anchor="middle">Carrier &amp; Province Lookup</text>
    <text x="279" y="200" fill="#94a3b8" font-size="7.5" text-anchor="middle">Fast SIM Attribution</text>
    
    <rect x="216" y="215" width="126" height="20" fill="#0b1120" stroke="#334155" stroke-width="1" rx="6"/>
    <text x="279" y="228" fill="#e2c974" font-size="7" font-weight="700" text-anchor="middle">OPS: 10X ACCEL</text>
  </g>

  <!-- Conduit 2 -> 3 -->
  <path d="M 354 155 L 388 155" stroke="#e2c974" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="390,155 380,150 380,160" fill="#e2c974"/>
  <text x="372" y="145" fill="#e2c974" font-size="7" font-weight="700" text-anchor="middle">CLEAN</text>

  <!-- ================= MODULE 03: PHONETIC BLOCKING ================= -->
  <g id="mod-clean">
    <rect x="390" y="60" width="150" height="190" fill="#111827" stroke="#334155" stroke-width="1.5" rx="6"/>
    <rect x="390" y="60" width="150" height="24" fill="#1e293b" rx="6"/>
    <text x="465" y="76" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">03 · NORMALISATION</text>
    
    <text x="465" y="105" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">PHONETIC BLOCKING</text>
    <text x="465" y="122" fill="#10b981" font-size="8.5" font-weight="700" text-anchor="middle">Persian Text Rules</text>
    
    <line x1="402" y1="135" x2="528" y2="135" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2"/>
    
    <text x="465" y="152" fill="#94a3b8" font-size="7.5" text-anchor="middle">Arabic/Persian Char Map</text>
    <text x="465" y="168" fill="#94a3b8" font-size="7.5" text-anchor="middle">ZWNJ Standardisation</text>
    <text x="465" y="184" fill="#06b6d4" font-size="7.5" text-anchor="middle">Phonetic Skeleton Collapse</text>
    <text x="465" y="200" fill="#94a3b8" font-size="7.5" text-anchor="middle">Sorted Token Fingerprint</text>
    
    <rect x="402" y="215" width="126" height="20" fill="#0b1120" stroke="#334155" stroke-width="1" rx="6"/>
    <text x="465" y="228" fill="#10b981" font-size="7" font-weight="700" text-anchor="middle">NORMALIZED: 100%</text>
  </g>

  <!-- Conduit 3 -> 4 -->
  <path d="M 540 155 L 574 155" stroke="#334155" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="576,155 566,150 566,160" fill="#334155"/>
  <text x="558" y="145" fill="#334155" font-size="7" font-weight="700" text-anchor="middle">INDEX</text>

  <!-- ================= MODULE 04: SMART DB v1 STORE ================= -->
  <g id="mod-store">
    <rect x="576" y="60" width="140" height="190" fill="#111827" stroke="#06b6d4" stroke-width="1.5" rx="6"/>
    <rect x="576" y="60" width="140" height="24" fill="#06b6d4" rx="6"/>
    <text x="646" y="76" fill="#0b1120" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">04 · SMART DB STORE</text>
    
    <text x="646" y="105" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">SMART DB v1</text>
    <text x="646" y="122" fill="#06b6d4" font-size="8.5" font-weight="700" text-anchor="middle">Parquet + Elastic</text>
    
    <line x1="588" y1="135" x2="704" y2="135" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2"/>
    
    <text x="646" y="152" fill="#94a3b8" font-size="7.5" text-anchor="middle">Snappy Compressed (-70%)</text>
    <text x="646" y="168" fill="#f8fafc" font-size="7.5" text-anchor="middle">70% Pre-KYC Accuracy</text>
    <text x="646" y="184" fill="#e2c974" font-size="7.5" text-anchor="middle">Decoupled API Gateway</text>
    <text x="646" y="200" fill="#94a3b8" font-size="7.5" text-anchor="middle">Zero Switch Contention</text>
    
    <rect x="588" y="215" width="116" height="20" fill="#0b1120" stroke="#334155" stroke-width="1" rx="6"/>
    <text x="646" y="228" fill="#10b981" font-size="7" font-weight="700" text-anchor="middle">STORAGE: -70% SIZE</text>
  </g>

  <!-- ================= INVARIANT TELEMETRY FOOTER ================= -->
  <rect x="24" y="268" width="692" height="48" fill="#111827" stroke="#334155" stroke-width="1" rx="6"/>
  <rect x="24" y="268" width="4" height="48" fill="#06b6d4" rx="6"/>
  <text x="38" y="286" fill="#06b6d4" font-size="8" font-weight="700" letter-spacing="1">ARCHITECTURAL INVARIANT:</text>
  <text x="175" y="286" fill="#f8fafc" font-size="8">70% PREDICTIVE ACCURACY FOR USER PREFERENCES PRIOR TO KYC DATA INGESTION. 100M RECORDS.</text>
  <text x="38" y="303" fill="#94a3b8" font-size="7.5">FAILURE MODE MITIGATION: DECOUPLING QUERY PATH INTO ELASTICSEARCH FRONTED BY API GATEWAY PREVENTS RDBMS COLLAPSE.</text>
</svg>
