<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid-pm" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    <style>
      text { font-family: 'Vazirmatn', 'IBM Plex Mono', system-ui, -apple-system, sans-serif; user-select: none; }
      .mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="500" fill="#0b1120" rx="10"/>
  <rect width="880" height="500" fill="url(#grid-pm)" rx="10"/>
  <rect x="0.5" y="0.5" width="879" height="499" stroke="#334155" stroke-width="1" rx="10"/>

  <!-- Tactical Header -->
  <line x1="16" y1="42" x2="864" y2="42" stroke="#334155" stroke-width="1"/>
  <rect x="24" y="18" width="8" height="8" fill="#10b981" rx="2"/>
  <text x="40" y="26" fill="#10b981" font-size="11" font-weight="700" letter-spacing="0.5" class="mono">DIAGRAM 06 · PRODUCT TAXONOMY &amp; ECOSYSTEM</text>
  <text x="340" y="26" fill="#e2e8f0" font-size="11" font-weight="600">ماتریس سبد محصولات ارائه‌دهندگان پنل و وب‌سرویس پیامک در ایران</text>
  <rect x="755" y="14" width="105" height="20" fill="#111827" stroke="#334155" rx="4"/>
  <text x="763" y="28" fill="#38bdf8" font-size="9" font-weight="700" class="mono">MARKET MAPPING</text>

  <!-- 3 Pillars Layout -->

  <!-- Pillar 1: Core Products (محصولات اصلی) -->
  <rect x="30" y="60" width="260" height="400" fill="#111827" stroke="#06b6d4" stroke-width="1.5" rx="8"/>
  <rect x="30" y="60" width="260" height="44" fill="#06b6d4" fill-opacity="0.12" rx="8 8 0 0"/>
  <text x="45" y="88" fill="#38bdf8" font-size="13" font-weight="700">۱. محصولات اصلی (Core)</text>
  <text x="210" y="87" fill="#06b6d4" font-size="9.5" class="mono">۱۰۰٪ بازیگران</text>

  <!-- Core items -->
  <rect x="45" y="120" width="230" height="150" fill="#1e293b" fill-opacity="0.6" stroke="#334155" rx="6"/>
  <text x="55" y="142" fill="#f8fafc" font-size="11" font-weight="700">پنل پیامک تحت وب (SaaS)</text>
  <text x="55" y="162" fill="#94a3b8" font-size="9.5">• ارسال گروهی و منطقه‌ای (نقشه، شهر، صنف)</text>
  <text x="55" y="180" fill="#94a3b8" font-size="9.5">• دفترچه تلفن و گروه‌بندی مشتریان</text>
  <text x="55" y="198" fill="#94a3b8" font-size="9.5">• کوتاه‌کننده لینک و لینک ترکینگ</text>
  <text x="55" y="216" fill="#94a3b8" font-size="9.5">• نظرسنجی، قرعه‌کشی و منشی خودکار</text>
  <text x="55" y="234" fill="#94a3b8" font-size="9.5">• گزارش تحویل لحظه‌ای (DLR Logs)</text>
  <text x="55" y="252" fill="#94a3b8" font-size="9.5">• تست A/B و زمان‌بندی ارسال هوشمند</text>

  <rect x="45" y="285" width="230" height="155" fill="#1e293b" fill-opacity="0.6" stroke="#334155" rx="6"/>
  <text x="55" y="307" fill="#f8fafc" font-size="11" font-weight="700">وب‌سرویس و API پیامک</text>
  <text x="55" y="327" fill="#94a3b8" font-size="9.5">• پروتکل‌های RESTful، SOAP و SDKها</text>
  <text x="55" y="345" fill="#94a3b8" font-size="9.5">• وب‌سرویس ارسال سریع اعتبارسنجی (OTP)</text>
  <text x="55" y="363" fill="#94a3b8" font-size="9.5">• اتصال مستقیم به خطوط خدماتی بدون بلک‌لیست</text>
  <text x="55" y="381" fill="#94a3b8" font-size="9.5">• قالب‌های تاییدشده (Pattern Verification)</text>
  <text x="55" y="399" fill="#94a3b8" font-size="9.5">• وب‌هوک و دریافت پاسخ کاربر (Inbound)</text>
  <text x="55" y="417" fill="#94a3b8" font-size="9.5">• مدیریت صف و ارسال موازی تراکنشی</text>

  <!-- Pillar 2: Complementary Products (محصولات مکمل) -->
  <rect x="310" y="60" width="260" height="400" fill="#111827" stroke="#10b981" stroke-width="1.5" rx="8"/>
  <rect x="310" y="60" width="260" height="44" fill="#10b981" fill-opacity="0.12" rx="8 8 0 0"/>
  <text x="325" y="88" fill="#34d399" font-size="13" font-weight="700">۲. محصولات مکمل (Value-Add)</text>
  <text x="480" y="87" fill="#10b981" font-size="9.5" class="mono">توسعه زنجیره</text>

  <!-- Complementary items -->
  <rect x="325" y="120" width="230" height="95" fill="#1e293b" fill-opacity="0.6" stroke="#334155" rx="6"/>
  <text x="335" y="142" fill="#f8fafc" font-size="11" font-weight="700">دستگاه سخت‌افزاری ذخیره شماره</text>
  <text x="335" y="162" fill="#94a3b8" font-size="9.5">• جذب شماره مشتریان حضوری فروشگاه‌ها</text>
  <text x="335" y="180" fill="#94a3b8" font-size="9.5">• همگام‌سازی لحظه‌ای با پنل از طریق WiFi</text>
  <text x="335" y="198" fill="#94a3b8" font-size="9.5">• ارسال پیامک خوش‌آمدگویی آنی باشگاه</text>

  <rect x="325" y="230" width="230" height="100" fill="#1e293b" fill-opacity="0.6" stroke="#334155" rx="6"/>
  <text x="335" y="252" fill="#f8fafc" font-size="11" font-weight="700">افزونه‌های نرم‌افزاری (Plugins)</text>
  <text x="335" y="272" fill="#94a3b8" font-size="9.5">• پلاگین‌های ووکامرس، وردپرس، پرستاشاپ</text>
  <text x="335" y="290" fill="#94a3b8" font-size="9.5">• احراز هویت با شماره موبایل (Digits)</text>
  <text x="335" y="308" fill="#94a3b8" font-size="9.5">• اطلاع‌رسانی وضعیت فاکتور و مرسوله</text>

  <rect x="325" y="345" width="230" height="95" fill="#1e293b" fill-opacity="0.6" stroke="#334155" rx="6"/>
  <text x="335" y="367" fill="#f8fafc" font-size="11" font-weight="700">یکپارچه‌سازی با نرم‌افزارهای سازمانی</text>
  <text x="335" y="387" fill="#94a3b8" font-size="9.5">• اتصال به CRM (دیدار، مایکروسافت، ویتایگر)</text>
  <text x="335" y="405" fill="#94a3b8" font-size="9.5">• اتصال به نرم‌افزارهای مالی (سپیدار، هلو)</text>
  <text x="335" y="423" fill="#94a3b8" font-size="9.5">• یکپارچگی با سیستم‌های انبار و لجستیک</text>

  <!-- Pillar 3: Extended Products (سایر کانال‌های ارتباطی) -->
  <rect x="590" y="60" width="260" height="400" fill="#111827" stroke="#8b5cf6" stroke-width="1.5" rx="8"/>
  <rect x="590" y="60" width="260" height="44" fill="#8b5cf6" fill-opacity="0.12" rx="8 8 0 0"/>
  <text x="605" y="88" fill="#a78bfa" font-size="13" font-weight="700">۳. کانال‌های مکمل (Extended)</text>
  <text x="755" y="87" fill="#8b5cf6" font-size="9.5" class="mono">اومنی‌چنل</text>

  <!-- Extended items -->
  <rect x="605" y="120" width="230" height="75" fill="#1e293b" fill-opacity="0.6" stroke="#334155" rx="6"/>
  <text x="615" y="142" fill="#f8fafc" font-size="11" font-weight="700">پیام صوتی (Voice Message)</text>
  <text x="615" y="162" fill="#94a3b8" font-size="9.5">• ارسال فایل صوتی ضبط‌شده تا ۶۰ ثانیه</text>
  <text x="615" y="180" fill="#94a3b8" font-size="9.5">• تحویل تضمینی به خطوط ثابت و همراه</text>

  <rect x="605" y="205" width="230" height="80" fill="#1e293b" fill-opacity="0.6" stroke="#334155" rx="6"/>
  <text x="615" y="227" fill="#f8fafc" font-size="11" font-weight="700">تلفن ابری (Cloud PBX)</text>
  <text x="615" y="247" fill="#94a3b8" font-size="9.5">• تخصیص سرشماره کشوری بدون سیم فیزیکی</text>
  <text x="615" y="265" fill="#94a3b8" font-size="9.5">• ضبط مکالمات، شنود، نجوا و صف تماس</text>

  <rect x="605" y="295" width="230" height="70" fill="#1e293b" fill-opacity="0.6" stroke="#334155" rx="6"/>
  <text x="615" y="317" fill="#f8fafc" font-size="11" font-weight="700">پوش نوتیفیکیشن (Web &amp; App)</text>
  <text x="615" y="337" fill="#94a3b8" font-size="9.5">• ارسال بدون هزینه پیامک به مشترکین وب</text>
  <text x="615" y="355" fill="#94a3b8" font-size="9.5">• سگمنت‌بندی و هوشمندسازی ارسال</text>

  <rect x="605" y="375" width="230" height="70" fill="#1e293b" fill-opacity="0.6" stroke="#334155" rx="6"/>
  <text x="615" y="397" fill="#f8fafc" font-size="11" font-weight="700">ایمیل مارکتینگ (Email Delivery)</text>
  <text x="615" y="417" fill="#94a3b8" font-size="9.5">• ویرایشگر قالب واکنش‌گرا و اتصال به پنل</text>
  <text x="615" y="435" fill="#94a3b8" font-size="9.5">• گزارش تحویل، باز شدن و ردیابی UTM</text>

  <!-- Footer note -->
  <text x="40" y="478" fill="#64748b" font-size="9.5" class="mono">PRODUCT TAXONOMY SYNTHESIS · BASED ON 100+ IRANIAN SMS PLATFORMS EVALUATION</text>
</svg>