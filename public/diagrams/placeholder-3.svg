<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%" fill="none">
  <!-- Rugged Outer Frame -->
  <rect width="600" height="340" fill="#141210"/>
  <rect x="0.5" y="0.5" width="599" height="339" stroke="#5c6650" stroke-width="1"/>

  <!-- Tactical Corner Crosshairs -->
  <rect x="2" y="2" width="6" height="6" fill="#141210" stroke="#c4562e" stroke-width="1"/>
  <rect x="592" y="2" width="6" height="6" fill="#141210" stroke="#c4562e" stroke-width="1"/>
  <rect x="2" y="332" width="6" height="6" fill="#141210" stroke="#c4562e" stroke-width="1"/>
  <rect x="592" y="332" width="6" height="6" fill="#141210" stroke="#c4562e" stroke-width="1"/>

  <!-- Top Metadata Bar -->
  <rect x="20" y="16" width="560" height="24" fill="#1c1916" stroke="#5c6650" stroke-width="1"/>
  <text x="32" y="32" fill="#c4562e" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" letter-spacing="1">SPEC.03 // TOPOLOGY</text>
  <text x="300" y="32" fill="#a8a196" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">ZERO-TRUST MULTI-TENANT IDENTITY SERVICE</text>
  <text x="568" y="32" fill="#c9d4a8" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" text-anchor="end">AUTH: RS256</text>

  <!-- Module 1: Clients -->
  <rect x="20" y="120" width="100" height="80" fill="#1c1916" stroke="#5c6650" stroke-width="1.5"/>
  <rect x="20" y="120" width="100" height="16" fill="#3d4632"/>
  <text x="70" y="132" fill="#c9d4a8" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">CLIENT APPS</text>
  <text x="70" y="156" fill="#e8e2d5" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">GATEWAYS</text>
  <text x="70" y="172" fill="#a8a196" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">mTLS / Internal</text>
  <text x="70" y="186" fill="#c9a15a" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">Multi-Tenant</text>

  <!-- Conduit 1 -->
  <line x1="120" y1="160" x2="165" y2="160" stroke="#c4562e" stroke-width="1.5"/>
  <polygon points="165,160 157,156 157,164" fill="#c4562e"/>

  <!-- Module 2: Identity Broker -->
  <rect x="165" y="85" width="155" height="150" fill="#1c1916" stroke="#c4562e" stroke-width="1.5"/>
  <rect x="165" y="85" width="155" height="18" fill="#c4562e"/>
  <text x="242" y="98" fill="#141210" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">IDENTITY BROKER</text>
  <text x="242" y="125" fill="#e8e2d5" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">UAA SERVICE</text>
  <line x1="175" y1="135" x2="310" y2="135" stroke="#5c6650"/>
  <text x="242" y="155" fill="#c9a15a" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">OAuth 2.1 / OIDC</text>
  <text x="242" y="175" fill="#a8a196" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">RS256 JWT Issuer</text>
  <text x="242" y="195" fill="#a8a196" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">Tenant Isolation DB</text>
  <text x="242" y="215" fill="#c9d4a8" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">Rotating Key Pairs</text>

  <!-- Branch conduits -->
  <path d="M 320 125 L 350 125 L 350 100 L 375 100" stroke="#c9a15a" stroke-width="1.5" fill="none"/>
  <polygon points="375,100 367,96 367,104" fill="#c9a15a"/>

  <path d="M 320 195 L 350 195 L 350 220 L 375 220" stroke="#5c6650" stroke-width="1.5" fill="none"/>
  <polygon points="375,220 367,216 367,224" fill="#5c6650"/>

  <!-- Module 3: OPA Policy Engine -->
  <rect x="375" y="65" width="185" height="74" fill="#1c1916" stroke="#c9a15a" stroke-width="1.5"/>
  <rect x="375" y="65" width="185" height="16" fill="#c9a15a"/>
  <text x="467" y="77" fill="#141210" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">POLICY ENGINE</text>
  <text x="467" y="101" fill="#e8e2d5" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">OPEN POLICY AGENT</text>
  <text x="467" y="117" fill="#a8a196" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">RBAC + ABAC Rego Rules</text>
  <text x="467" y="129" fill="#c9d4a8" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">Sub-Millisecond Evaluation</text>

  <!-- Module 4: Distributed Cache -->
  <rect x="375" y="185" width="185" height="74" fill="#1c1916" stroke="#5c6650" stroke-width="1.5"/>
  <rect x="375" y="185" width="185" height="16" fill="#3d4632"/>
  <text x="467" y="197" fill="#c9d4a8" font-family="'IBM Plex Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">REVOCATION STORE</text>
  <text x="467" y="221" fill="#e8e2d5" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">REDIS SENTINEL</text>
  <text x="467" y="237" fill="#a8a196" font-family="'IBM Plex Mono', monospace" font-size="8" text-anchor="middle">Instant Token Blacklist</text>
  <text x="467" y="249" fill="#c9a15a" font-family="'IBM Plex Mono', monospace" font-size="7" text-anchor="middle">Active Session Store</text>
</svg>
