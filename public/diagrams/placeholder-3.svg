<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 340" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid-p3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#221e1a" stroke-width="0.5"/>
    </pattern>
    <style>
      text {
        font-family: 'IBM Plex Mono', monospace;
        user-select: none;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="740" height="340" fill="#141210" rx="0"/>
  <rect width="740" height="340" fill="url(#grid-p3)" rx="0"/>

  <!-- Outer Frame & Tactical Reticle -->
  <rect x="0.5" y="0.5" width="739" height="339" stroke="#5c6650" stroke-width="1" rx="0"/>
  <rect x="8" y="8" width="724" height="324" stroke="#5c6650" stroke-width="0.5" stroke-opacity="0.4" rx="0"/>

  <!-- Tactical Corner Crosshairs -->
  <path d="M 4 14 L 4 4 L 14 4" stroke="#c9a15a" stroke-width="1.5" fill="none"/>
  <path d="M 726 4 L 736 4 L 736 14" stroke="#c9a15a" stroke-width="1.5" fill="none"/>
  <path d="M 4 326 L 4 336 L 14 336" stroke="#c9a15a" stroke-width="1.5" fill="none"/>
  <path d="M 726 336 L 736 336 L 736 326" stroke="#c9a15a" stroke-width="1.5" fill="none"/>

  <!-- Telemetry Header Bar -->
  <line x1="8" y1="36" x2="732" y2="36" stroke="#5c6650" stroke-width="1" stroke-opacity="0.6"/>
  <rect x="18" y="16" width="6" height="6" fill="#c4562e" rx="0"/>
  <text x="32" y="23" fill="#c4562e" font-size="9" font-weight="700" letter-spacing="1.5">SPEC-ID: 8409-AS // 03 // NATIONAL TELECOM SMS ROUTING HUB</text>
  <text x="440" y="23" fill="#a8a196" font-size="8" letter-spacing="0.5">SMPP 3.4 / CARRIER CONDUITS</text>
  <rect x="620" y="13" width="102" height="17" fill="#1c1916" stroke="#5c6650" stroke-width="1" rx="0"/>
  <rect x="626" y="18" width="6" height="6" fill="#c9d4a8" rx="0"/>
  <text x="638" y="24" fill="#c9d4a8" font-size="7.5" font-weight="700" letter-spacing="0.5">BURST: 50K TPS</text>

  <!-- ================= MODULE 01: QUEUE INGRESS PARTITIONS ================= -->
  <g id="mod-queue">
    <rect x="24" y="60" width="140" height="190" fill="#1c1916" stroke="#c4562e" stroke-width="1.5" rx="0"/>
    <rect x="24" y="60" width="140" height="24" fill="#c4562e" rx="0"/>
    <text x="94" y="76" fill="#141210" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">01 // INGRESS QUEUE</text>
    
    <text x="94" y="105" fill="#e8e2d5" font-size="11" font-weight="700" text-anchor="middle">QUEUE PARTITIONS</text>
    <text x="94" y="122" fill="#c4562e" font-size="8.5" font-weight="700" text-anchor="middle">Kafka / RabbitMQ</text>
    
    <line x1="36" y1="135" x2="152" y2="135" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="2 2"/>
    
    <text x="94" y="152" fill="#c9d4a8" font-size="7.5" font-weight="700" text-anchor="middle">TIER 1: Banking OTP</text>
    <text x="94" y="168" fill="#a8a196" font-size="7.5" text-anchor="middle">TIER 2: Trans. Alerts</text>
    <text x="94" y="184" fill="#a8a196" font-size="7.5" text-anchor="middle">TIER 3: Bulk Campaigns</text>
    <text x="94" y="200" fill="#c9a15a" font-size="7.5" text-anchor="middle">Strict Pipe Isolation</text>
    
    <rect x="36" y="215" width="116" height="20" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
    <text x="94" y="228" fill="#c9d4a8" font-size="7" font-weight="700" text-anchor="middle">ZERO OTP DROP</text>
  </g>

  <!-- Conduit 1 -> 2 -->
  <path d="M 164 155 L 196 155" stroke="#c4562e" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="198,155 188,150 188,160" fill="#c4562e"/>
  <text x="181" y="145" fill="#c4562e" font-size="7" font-weight="700" text-anchor="middle">PDUs</text>

  <!-- ================= MODULE 02: SMPP 3.4 ROUTER & THROTTLE ================= -->
  <g id="mod-smpp">
    <rect x="198" y="60" width="168" height="190" fill="#1c1916" stroke="#c9a15a" stroke-width="1.5" rx="0"/>
    <rect x="198" y="60" width="168" height="24" fill="#c9a15a" rx="0"/>
    <text x="282" y="76" fill="#141210" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">02 // SMPP 3.4 ROUTER</text>
    
    <text x="282" y="105" fill="#e8e2d5" font-size="11" font-weight="700" text-anchor="middle">SLIDING WINDOW HUB</text>
    <text x="282" y="122" fill="#c9a15a" font-size="8.5" font-weight="700" text-anchor="middle">Window: 16-64 PDU</text>
    
    <line x1="210" y1="135" x2="354" y2="135" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="2 2"/>
    
    <text x="282" y="152" fill="#e8e2d5" font-size="7.5" text-anchor="middle">UCS-2 Persian Encoding</text>
    <text x="282" y="168" fill="#a8a196" font-size="7.5" text-anchor="middle">70-Char Single / 67-Concat</text>
    <text x="282" y="184" fill="#c4562e" font-size="7.5" text-anchor="middle">*800# DND Service Line Bypass</text>
    <text x="282" y="200" fill="#a8a196" font-size="7.5" text-anchor="middle">Upstream HLR Dead Check</text>
    
    <rect x="210" y="215" width="144" height="20" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
    <text x="282" y="228" fill="#c9a15a" font-size="7" font-weight="700" text-anchor="middle">PREFIX: 1000–9000</text>
  </g>

  <!-- Branch Conduits to Carriers -->
  <!-- Branch to MCI (Upper) -->
  <path d="M 366 125 L 396 125 L 396 105 L 420 105" stroke="#5c6650" stroke-width="2"/>
  <polygon points="422,105 412,100 412,110" fill="#5c6650"/>
  <text x="408" y="96" fill="#c9d4a8" font-size="6.5" font-weight="700">MCI PIPE</text>

  <!-- Branch to Irancell (Lower) -->
  <path d="M 366 185 L 396 185 L 396 205 L 420 205" stroke="#c4562e" stroke-width="2"/>
  <polygon points="422,205 412,200 412,210" fill="#c4562e"/>
  <text x="404" y="220" fill="#c4562e" font-size="6.5" font-weight="700">MTN PIPE</text>

  <!-- ================= MODULE 03A: MCI SMSC CARRIER ================= -->
  <g id="mod-mci">
    <rect x="422" y="60" width="146" height="90" fill="#1c1916" stroke="#5c6650" stroke-width="1.2" rx="0"/>
    <rect x="422" y="60" width="146" height="18" fill="#3d4632" rx="0"/>
    <text x="495" y="73" fill="#c9d4a8" font-size="8" font-weight="700" text-anchor="middle">MCI SMSC CARRIER</text>
    
    <text x="495" y="96" fill="#e8e2d5" font-size="9.5" font-weight="700" text-anchor="middle">Stateful TCP Bind</text>
    <text x="495" y="112" fill="#a8a196" font-size="7.5" text-anchor="middle">Prefixes: 1000 / 3000 / 9000</text>
    <text x="495" y="128" fill="#c9a15a" font-size="7.5" text-anchor="middle">Aggregators: Magfa / Rahyab</text>
    <rect x="430" y="134" width="130" height="12" fill="#141210" rx="0"/>
    <text x="495" y="143" fill="#c9d4a8" font-size="6.5" font-weight="700" text-anchor="middle">WINDOW: HEALTHY (48/64)</text>
  </g>

  <!-- ================= MODULE 03B: IRANCELL SMSC CARRIER ================= -->
  <g id="mod-mtn">
    <rect x="422" y="160" width="146" height="90" fill="#1c1916" stroke="#c4562e" stroke-width="1.2" rx="0"/>
    <rect x="422" y="160" width="146" height="18" fill="#c4562e" rx="0"/>
    <text x="495" y="173" fill="#141210" font-size="8" font-weight="700" text-anchor="middle">IRANCELL SMSC CARRIER</text>
    
    <text x="495" y="196" fill="#e8e2d5" font-size="9.5" font-weight="700" text-anchor="middle">Direct Peer Gateway</text>
    <text x="495" y="212" fill="#a8a196" font-size="7.5" text-anchor="middle">Prefixes: 2000 / 5000</text>
    <text x="495" y="228" fill="#c9a15a" font-size="7.5" text-anchor="middle">Low-Latency Fast Path</text>
    <rect x="430" y="234" width="130" height="12" fill="#141210" rx="0"/>
    <text x="495" y="243" fill="#c9d4a8" font-size="6.5" font-weight="700" text-anchor="middle">WINDOW: HEALTHY (52/64)</text>
  </g>

  <!-- Conduits from Carriers to DLR -->
  <path d="M 568 105 L 590 105 L 590 135 L 600 135" stroke="#5c6650" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 568 205 L 590 205 L 590 175 L 600 175" stroke="#c4562e" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="604,155 596,150 596,160" fill="#c9a15a"/>

  <!-- ================= MODULE 04: ASYNC DLR TRACKER ================= -->
  <g id="mod-dlr">
    <rect x="604" y="60" width="112" height="190" fill="#1c1916" stroke="#c9a15a" stroke-width="1.5" rx="0"/>
    <rect x="604" y="60" width="112" height="24" fill="#c9a15a" rx="0"/>
    <text x="660" y="76" fill="#141210" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1">04 // DLR ENGINE</text>
    
    <text x="660" y="105" fill="#e8e2d5" font-size="10" font-weight="700" text-anchor="middle">DLR TRACKER</text>
    <text x="660" y="122" fill="#c9a15a" font-size="7.5" font-weight="700" text-anchor="middle">Async Receipts</text>
    
    <line x1="614" y1="135" x2="706" y2="135" stroke="#5c6650" stroke-width="0.8" stroke-dasharray="2 2"/>
    
    <text x="660" y="152" fill="#a8a196" font-size="7" text-anchor="middle">Source of Truth</text>
    <text x="660" y="168" fill="#e8e2d5" font-size="7" text-anchor="middle">DELIVRD Status</text>
    <text x="660" y="184" fill="#c4562e" font-size="7" text-anchor="middle">UNDELIV Replay</text>
    <text x="660" y="200" fill="#a8a196" font-size="7" text-anchor="middle">Audit Ledger Ack</text>
    
    <rect x="612" y="215" width="96" height="20" fill="#141210" stroke="#5c6650" stroke-width="1" rx="0"/>
    <text x="660" y="228" fill="#c9d4a8" font-size="6.5" font-weight="700" text-anchor="middle">TRUTH VERIFIED</text>
  </g>

  <!-- ================= INVARIANT TELEMETRY FOOTER ================= -->
  <rect x="24" y="268" width="692" height="48" fill="#1c1916" stroke="#5c6650" stroke-width="1" rx="0"/>
  <rect x="24" y="268" width="4" height="48" fill="#c9a15a" rx="0"/>
  <text x="38" y="286" fill="#c9a15a" font-size="8" font-weight="700" letter-spacing="1">ARCHITECTURAL INVARIANT:</text>
  <text x="175" y="286" fill="#e8e2d5" font-size="8">AUTHENTICATION OTP TRAFFIC CANNOT SHARE PIPES WITH MARKETING BROADCASTS. 1B+ SMS ROUTED / YR.</text>
  <text x="38" y="303" fill="#a8a196" font-size="7.5">FAILURE MODE MITIGATION: DYNAMIC SLIDING-WINDOW THROTTLE (16-64 PDU) + UPSTREAM HLR TO PREVENT CARRIER SATURATION.</text>
</svg>
