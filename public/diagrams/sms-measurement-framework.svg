<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="grid-mf" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    <style>
      text { font-family: 'Vazirmatn', 'IBM Plex Mono', system-ui, -apple-system, sans-serif; user-select: none; }
      .mono { font-family: 'IBM Plex Mono', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="880" height="480" fill="#0b1120" rx="10"/>
  <rect width="880" height="480" fill="url(#grid-mf)" rx="10"/>
  <rect x="0.5" y="0.5" width="879" height="479" stroke="#334155" stroke-width="1" rx="10"/>

  <!-- Tactical Header -->
  <line x1="16" y1="42" x2="864" y2="42" stroke="#334155" stroke-width="1"/>
  <rect x="24" y="18" width="8" height="8" fill="#06b6d4" rx="2"/>
  <text x="40" y="26" fill="#06b6d4" font-size="11" font-weight="700" letter-spacing="0.5" class="mono">DIAGRAM 04 · CHARCHOOB-E-SANJESH</text>
  <text x="310" y="26" fill="#e2e8f0" font-size="11" font-weight="600">چارچوب راستی‌آزمایی تله‌متری: تحویل رادیویی پروتکل در برابر توجه شناختی</text>
  <rect x="735" y="14" width="125" height="20" fill="#111827" stroke="#334155" rx="4"/>
  <text x="745" y="28" fill="#f43f5e" font-size="9" font-weight="700" class="mono">نقد ادعای نرخ ۹۸٪</text>

  <!-- 4-TIER FUNNEL CARDS -->
  <g id="funnel-steps">
    <!-- Step 1: Radio Layer -->
    <rect x="30" y="58" width="195" height="210" fill="#111827" stroke="#3b82f6" stroke-width="1.2" rx="6"/>
    <rect x="30" y="58" width="195" height="24" fill="#1d4ed8" rx="6"/>
    <text x="127" y="74" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">۱. لایه پروتکل شبکه (DLR)</text>

    <text x="42" y="104" fill="#38bdf8" font-size="10" font-weight="700" class="mono">وضعیت: DELIVRD (~۹۷٪)</text>
    <text x="42" y="122" fill="#e2e8f0" font-size="8.5">رسید تأیید PDU از سوی دکل مخابراتی BTS و مودم رادیویی گوشی کاربر.</text>
    <rect x="42" y="142" width="171" height="42" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="50" y="158" fill="#10b981" font-size="8" font-weight="600">تأیید فنی قطعی:</text>
    <text x="50" y="174" fill="#94a3b8" font-size="7.5">رسیدن بسته به آنتن گوشی مشترک</text>

    <text x="42" y="202" fill="#f43f5e" font-size="8" font-weight="700">محدودیت پروتکل:</text>
    <text x="42" y="218" fill="#94a3b8" font-size="7.5">پروتکل GSM فاقد هرگونه سیگنال خوانده شدن یا توجه انسانی است.</text>
    <text x="42" y="246" fill="#64748b" font-size="8" class="mono">ابزار: SMPP deliver_sm receipt</text>

    <!-- Connector 1->2 -->
    <path d="M 225 163 L 245 163" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Step 2: OS Notification Layer -->
    <rect x="245" y="58" width="195" height="210" fill="#111827" stroke="#06b6d4" stroke-width="1.2" rx="6"/>
    <rect x="245" y="58" width="195" height="24" fill="#0891b2" rx="6"/>
    <text x="342" y="74" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">۲. لایه سیستم‌عامل (OS)</text>

    <text x="257" y="104" fill="#22d3ee" font-size="10" font-weight="700">نوتیفیکیشن و پیش‌نمایش</text>
    <text x="257" y="122" fill="#e2e8f0" font-size="8.5">ظاهر شدن پیام در لاک‌اسکرین، بنر بالای صفحه یا نوار اعلان‌های اندروید/iOS.</text>
    <rect x="257" y="142" width="171" height="42" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="265" y="158" fill="#e2c974" font-size="8" font-weight="600">رفتار کاربر:</text>
    <text x="265" y="174" fill="#94a3b8" font-size="7.5">مشاهده اجمالی (Glance) بدون باز کردن</text>

    <text x="257" y="202" fill="#f43f5e" font-size="8" font-weight="700">خوانده شدن پنهان:</text>
    <text x="257" y="218" fill="#94a3b8" font-size="7.5">کد OTP یا تخفیف از نوتیفیکیشن کپی شده بدون باز کردن اپ پیام‌رسان.</text>
    <text x="257" y="246" fill="#64748b" font-size="8" class="mono">ابزار: فاقد لاگ در سمت فرستنده</text>

    <!-- Connector 2->3 -->
    <path d="M 440 163 L 460 163" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Step 3: Application Open Layer -->
    <rect x="460" y="58" width="195" height="210" fill="#111827" stroke="#e2c974" stroke-width="1.2" rx="6"/>
    <rect x="460" y="58" width="195" height="24" fill="#ca8a04" rx="6"/>
    <text x="557" y="74" fill="#0b1120" font-size="9.5" font-weight="700" text-anchor="middle">۳. لایه اپلیکیشن پیام‌رسان</text>

    <text x="472" y="104" fill="#facc15" font-size="10" font-weight="700">باز کردن مکالمه (Thread Open)</text>
    <text x="472" y="122" fill="#e2e8f0" font-size="8.5">کاربر مستقیماً برنامه Messages را باز کرده و گفتگوی مربوط به فرستنده را می‌بیند.</text>
    <rect x="472" y="142" width="171" height="42" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="480" y="158" fill="#e2c974" font-size="8" font-weight="600">نرخ ادعایی نظرسنجی:</text>
    <text x="480" y="174" fill="#94a3b8" font-size="7.5">گزارش ۹۱٪ نظرسنجی SMS.ir (مبتنی بر پرسشنامه)</text>

    <text x="472" y="202" fill="#f43f5e" font-size="8" font-weight="700">خطای روش‌شناختی:</text>
    <text x="472" y="218" fill="#94a3b8" font-size="7.5">مبتنی بر ادراک شخصی مخاطب، نه رصد دیتای واقعی نرم‌افزاری و ترافیکی.</text>
    <text x="472" y="246" fill="#64748b" font-size="8" class="mono">ابزار: نظرسنجی نمونه‌ای (Survey)</text>

    <!-- Connector 3->4 -->
    <path d="M 655 163 L 675 163" stroke="#e2c974" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Step 4: Conversion & Telemetry -->
    <rect x="675" y="58" width="175" height="210" fill="#111827" stroke="#10b981" stroke-width="1.2" rx="6"/>
    <rect x="675" y="58" width="175" height="24" fill="#059669" rx="6"/>
    <text x="762" y="74" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle">۴. اقدام و تبدیل تجاری</text>

    <text x="687" y="104" fill="#34d399" font-size="10" font-weight="700">کلیک و تأیید هویت (Action)</text>
    <text x="687" y="122" fill="#e2e8f0" font-size="8.5">تنها معیار قابل استناد و اندازه‌گیری مهندسی در سمت سرور کسب‌وکار.</text>
    <rect x="687" y="142" width="151" height="42" fill="#0f172a" stroke="#1e293b" rx="4"/>
    <text x="695" y="158" fill="#10b981" font-size="8" font-weight="600">معیارهای اندازه‌پذیر:</text>
    <text x="695" y="174" fill="#94a3b8" font-size="7.5">کلیک روی لینک اختصاصی، ورود کد OTP</text>

    <text x="687" y="202" fill="#10b981" font-size="8" font-weight="700">نرخ کلیک متعارف (CTR):</text>
    <text x="687" y="218" fill="#94a3b8" font-size="7.5">در کمپین‌های استاندارد: بین ۲٪ تا ۹٪ بسته به میزان ارتباط و تارگتینگ.</text>
    <text x="687" y="246" fill="#64748b" font-size="8" class="mono">ابزار: Shortlink با هش اختصاصی</text>
  </g>

  <!-- CRITICAL MYTH BUSTING COMPARISON BOX -->
  <g id="myth-busting">
    <rect x="30" y="284" width="820" height="180" fill="#111827" stroke="#334155" rx="8"/>
    <rect x="30" y="284" width="280" height="24" fill="#334155" rx="8"/>
    <text x="170" y="300" fill="#f8fafc" font-size="10" font-weight="700" text-anchor="middle">کالبدشکافی ادعای تجاری «نرخ باز شدن ۹۸ درصدی»</text>

    <!-- Left Box: The Myth -->
    <rect x="46" y="318" width="370" height="132" fill="#1f1315" stroke="#991b1b" stroke-width="1" rx="6"/>
    <text x="60" y="338" fill="#f87171" font-size="11" font-weight="700">افسانه رایج در مارکتینگ و وب‌سایت‌های ارائه‌دهنده:</text>
    <text x="60" y="358" fill="#fca5a5" font-size="9">«۹۸ درصد پیامک‌ها ظرف ۳ دقیقه توسط مخاطبان خوانده می‌شوند!»</text>
    <text x="60" y="378" fill="#e2e8f0" font-size="8.5">ریشه ادعا: یک پرسشنامه تبلیغاتی قدیمی در سال ۲۰۱۰ در آمریکا بدون اعتبارسنجی تله‌متری مخابراتی.</text>
    <text x="60" y="396" fill="#cbd5e1" font-size="8.5">مغالطه تکنیکال: یکسان فرض کردن «رسیدن پکت رادیویی به سخت‌افزار» با «توجه هشیارانه و خواندن پیام توسط ذهن انسان».</text>
    <text x="60" y="416" fill="#fca5a5" font-size="8" font-weight="600">نتیجه: ایجاد خطای محاسباتی در پیش‌بینی بازگشت سرمایه کمپین‌های سازمانی.</text>

    <!-- Right Box: The Reality -->
    <rect x="434" y="318" width="400" height="132" fill="#0f1d18" stroke="#065f46" stroke-width="1" rx="6"/>
    <text x="448" y="338" fill="#34d399" font-size="11" font-weight="700">واقعیت مهندسی تله‌متری و استانداردهای 3GPP / GSM:</text>
    <text x="448" y="358" fill="#6ee7b7" font-size="9">تأییدیه DELIVRD تنها تحویل فیزیکی به رادیوی دستگاه را تضمین می‌کند.</text>
    <text x="448" y="378" fill="#e2e8f0" font-size="8.5">سیستم‌عامل‌های مدرن (iOS / Android) پیام‌های تبلیغاتی ناشناس را به تب اسپم/ناشناس منتقل می‌کنند.</text>
    <text x="448" y="396" fill="#cbd5e1" font-size="8.5">تنها معیار معتبر مهندسی برای ارزیابی اثرگذاری پیامک تجاری، ردیابی سمت سرور (Server-side telemetry) شامل ثبت کلیک، ورود توکن احراز هویت و نرخ تبدیل است.</text>
    <text x="448" y="420" fill="#34d399" font-size="8" font-weight="600">نتیجه: تمرکز بر نرخ تبدیل واقعی (Conversion Rate) به جای اعداد وهم‌آلود بازاریابی.</text>
  </g>
</svg>
