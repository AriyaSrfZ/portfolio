<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" fill="none">
  <!-- Carbon Canvas & Structure -->
  <rect width="1584" height="396" fill="#202725" />
  
  <!-- Subtle Blueprint Grid (36px rhythm) -->
  <defs>
    <pattern id="li-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#303936" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>
  </defs>
  <rect width="1584" height="396" fill="url(#li-grid)" />

  <!-- Frame Border -->
  <rect x="24" y="24" width="1536" height="348" rx="12" stroke="#46504B" stroke-width="1.5" fill="none" />

  <!-- Avatar Safe Zone Annotation (Invisible in production rendering, guarantees zero text collision) -->
  <!-- LinkedIn desktop avatar overlaps the bottom-left region: x: 40-240, y: 200-380 -->

  <!-- AS Monogram Mark (Centered / Right Half) -->
  <g transform="translate(360, 84) scale(0.9)">
    <rect width="120" height="120" rx="24" fill="#303936" stroke="#46504B" stroke-width="1.5" />
    <path d="M28 96 L52 24 C53.5 19 58.5 19 60 24 L84 96" stroke="#F0EEE7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M38 68 L74 68" stroke="#F0EEE7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M84 36 C80 26 68 22 56 26 C44 30 42 42 50 49 C58 56 76 58 76 74 C76 86 64 94 48 94 C36 94 28 88 26 78" stroke="#8FB4AA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Archetype Badge -->
  <g transform="translate(490, 88)">
    <rect width="260" height="28" rx="14" fill="#303936" stroke="#46504B" stroke-width="1" />
    <circle cx="14" cy="14" r="3.5" fill="#8FB4AA" />
    <text x="26" y="18" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#F0EEE7" letter-spacing="1.2">THE SYSTEMS THINKER</text>
  </g>

  <!-- Full Name & Primary Tagline -->
  <text x="490" y="152" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="38" font-weight="700" fill="#F0EEE7" letter-spacing="-0.5">Ariya Sarrafzadeh</text>
  <text x="490" y="188" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="20" font-weight="500" fill="#8FB4AA">Systems that hold under pressure.</text>

  <!-- Supporting Statement -->
  <text x="490" y="228" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#B5BDB6">
    <tspan x="490" dy="0">Designing dependable technology for complex, high-stakes environments.</tspan>
    <tspan x="490" dy="20">Systems Architecture · High-Throughput Payment Switches · Distributed Ledgers · Telecom Infrastructure</tspan>
  </text>

  <!-- Capability Badges -->
  <g transform="translate(490, 276)">
    <rect x="0" y="0" width="130" height="26" rx="5" fill="#171C1A" stroke="#46504B" stroke-width="1" />
    <text x="65" y="17" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="500" fill="#8FB4AA" text-anchor="middle">ACID LEDGERS</text>

    <rect x="142" y="0" width="140" height="26" rx="5" fill="#171C1A" stroke="#46504B" stroke-width="1" />
    <text x="212" y="17" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="500" fill="#8FB4AA" text-anchor="middle">ISO 8583 SWITCH</text>

    <rect x="294" y="0" width="140" height="26" rx="5" fill="#171C1A" stroke="#46504B" stroke-width="1" />
    <text x="364" y="17" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="500" fill="#8FB4AA" text-anchor="middle">SMPP 3.4 TELECOM</text>

    <rect x="446" y="0" width="140" height="26" rx="5" fill="#171C1A" stroke="#46504B" stroke-width="1" />
    <text x="516" y="17" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="500" fill="#8FB4AA" text-anchor="middle">eKYC &amp; RISK GRAPH</text>

    <rect x="598" y="0" width="160" height="26" rx="5" fill="#171C1A" stroke="#46504B" stroke-width="1" />
    <text x="678" y="17" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="500" fill="#8FB4AA" text-anchor="middle">TECHNICAL ADVISORY</text>
  </g>

  <!-- Domain Verification -->
  <text x="1510" y="342" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#8FB4AA" text-anchor="end">ariya-sarrafzadeh.ir</text>
</svg>
